# Swedish character substitutions for CR-007 /ops normalize and pre-write validators
#
# Format: each entry is a literal-word substitution from the (incorrect) ASCII
# form to the (correct) Swedish form. Word-boundary matching is used at scan time.
# Seeded from MEMORY.md "Common failures" list.
#
# False-positive handling: scanners must skip code blocks (```...```), inline
# code (`...`), URLs, file paths, YAML keys, and lines marked with the comment
# `<!-- no-normalize -->`. Ambiguous cases (where the word could be Swedish or
# English) are reported but not auto-fixed when running with --strict-no-ambiguous.
#
# This file is loaded by:
# - /ops normalize subcommand
# - /insights pre-write Swedish character validator
# - /transcript and /ops summary writers (defence in depth)

version: 1
last_updated: 260407

