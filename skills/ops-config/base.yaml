# ops-config base defaults
# Schema version: 1.3
# These values are used when no org-specific or project-level config exists

schema_version: "1.3"
organization: Generic
language: input  # Match transcript language by default

# Swedish character enforcement (CR-007)
# When strict, ALL Swedish text MUST use correct å, ä, ö
swedish_chars: strict

# Sub-tree inheritance (CR-007)
# When writing files under these paths, treat swedish_chars as strict
# regardless of local config. This catches sub-trees like _projects/<client>/
# that have no CLAUDE.md of their own.
language_inheritance:
  enabled: true
  apply_swedish_chars_strict_to:
    - "_projects/**"
    - "_contacts/**"
    - "_private/**"
    - "_inbox/**"
  override_via: "CLAUDE.md per folder, or _meta.yaml swedish_chars override"

# Contact privacy defaults (CR-009)
# When _meta.yaml is absent or has no classification field, these globs apply.
# Override per contact via _meta.yaml classification field.
privacy_defaults:
  family:
    - "_contacts/a1-*"
    - "_contacts/a2*"
  personal:
    - "_private/**"
  professional: "**"  # default fallback

# Empty team - must be defined in org config
team: []

# No responsibility matrix by default
responsibility_matrix: {}

# Common terminology across all organizations
terminology:
  - term: P0
    definition: Critical blocker affecting operations/revenue
  - term: P1
    definition: High priority, needed this week
  - term: P2
    definition: Important, needed within 2 weeks
  - term: P3
    definition: Research/exploration, flexible timing
  - term: BLOCKED
    definition: External dependency preventing progress
  - term: IN PROGRESS
    definition: Active work underway
  - term: ON TRACK
    definition: Progressing as expected
  - term: TODO
    definition: Planned but not started
  - term: COMPLETE
    definition: Finished

# No custom summary sections by default (uses TWO-TIER format from CLAUDE.md)
summary_sections: []

# No domain-specific status terms by default (uses ops-base P0-P3 + standard terms)
status_terminology: {}

# No structured issue IDs by default
issue_id_format: null

# Minimal workflow by default
workflows:
  update_files:
    - summary
  action_propagation:
    enabled: false
  agenda_management:
    enabled: false
  post_processing:
    task_import:
      enabled: false
    dashboard_refresh:
      enabled: false
  knowledge_extraction:
    enabled: true
    min_insights: 1
    types: [decision, preference, learning, opportunity, pattern, edge_case, correction, skill_pattern]
    max_per_meeting: 10
    evolution:
      enabled: true
      auto_apply: false
      compile_threshold: 3
      propose_threshold: 5
      demote_on_contradiction: true   # CR-013: rule -> hypothesis on contradiction

# No custom templates by default
templates: {}

# No domain additions by default
domain_additions: []

