# ecosystem.yaml — Shared contract for core-skills ecosystem
# Single source of truth for type enums, skill metadata, schema versions,
# and vault file conventions.
# Marvin (formerly core-skills-visualisation) and the landing page reference
# this file. Future tools (Trillian, external skills, third-party clients)
# should also use it as the authoritative contract.
# No PII. Public-safe.

# CORRECTION 2026-09-12 (CR-044): this field read `2` until today. Versions 3-6
# below were each documented by their CR but the value was never changed —
# `git log -S` finds one commit touching it, the one that created this file.
# Nothing reads the field back, so nothing caught it. Corrected to 7 in one step;
# no client was ever served 3, 4, 5 or 6.
#
# contract_version 16 (CR-054, 2026-09-21): external_systems in the ops config —
#   a folder declares which chats its work is posted to and which repositories it
#   concerns. Written because the destination of a staged recap was nowhere
#   declared: it was chosen from a live list of seventy chats by recognising the
#   name. A declaration, never a credential; hand-written, so a tool may read it
#   but never append what it happened to use.
#
# contract_version 15 (CR-053, 2026-09-21): the manifest's fields are named by
#   IDENTIFIER here, not by the Swedish label a vault writes them under - five
#   entries said "Status, Kanal, Kontakt", which reads as Swedish identifiers in
#   a public contract and invites a tool to hardcode the label. Also declares the
#   status-note field: it was in use by 104 live manifests while appearing in no
#   schema, and a dispatcher may write it because recording what it did is
#   observation, not judgement.
#
# contract_version 14 (CR-052, 2026-09-21): inventory scanner component and the
#   generated _INDEX-*.md registers it writes. Found by asking which parts of the
#   graph were content rather than architecture: the scanner had been left out
#   although it writes vault files, and check-components.py had let its write pass
#   because the entry was phrased as prose rather than a path. Both fixed.
#
# contract_version 13 (CR-051, 2026-09-21): _infrastructure/ and _architecture/
#   declared. The first was named in prefix_conventions since CR-034 but never
#   declared as a path; the second is its counterpart for the software system —
#   the same question one layer up. Both SINGLETON: each describes the whole,
#   so a folder-scoped copy would describe nothing.
#
# contract_version 12 (CR-050, 2026-09-21): components block — declares how the
#   parts touch EACH OTHER, where vault_conventions declares how they touch files.
#   Written because "where is the full picture documented" had no single answer:
#   it was spread across five places, none machine readable. Writing it found two
#   vault files nothing had declared. scripts/check-components.py keeps the two
#   blocks honest; it runs from the alignment check.
#
# contract_version 11 (CR-049, 2026-09-21): identifier_language rule — identifiers
#   are English, the words a person reads are data. Written after a dispatcher was
#   found hardcoding the vault's Swedish status words and a sync tool using Swedish
#   display strings as dictionary keys in 38 places.
#
# contract_version 10 (CR-048, 2026-09-21): task_statuses enum — declares which
#   statuses a task may carry. schemas.tasks named a version but never the legal
#   values, and three dialects grew in the gap; a reader that knew only the
#   canonical set counted finished tasks as outstanding. Split active/finished,
#   since that is the question every consumer actually asks.
#
# contract_version 9 (CR-047, 2026-09-21): outbound_dispatch block — declares the
#   tools that deliver staged material, the channels they use, and what each
#   may write. Also declares <venture>/.chats/
#   and brings the _outbox/ declaration up to date with the manifest contract.
#   Additive: clients on 8 ignore it.
# contract_version 8 (CR-046, 2026-09-20): `metric` added to insight_types.content --
#   a measurement where the number IS the insight, with optional value/unit/baseline/
#   period/trend fields. Excluded from CR-013 promotion: a repeated measurement is a
#   time series, not a rule.
# contract_version 7 (CR-040, 2026-09-12): a PER_FOLDER file's presence may be
#   CONDITIONAL — a folder declaring an external system of record legitimately has
#   no _tasks.yaml. Parsers must not read that absence as missing data.
# contract_version 6 (CR-038, 2026-09-08): generated-view isolation + system-file language.
# contract_version 5 (CR-037, 2026-09-07): rule hierarchy + conflict resolution.
# contract_version 4 (CR-036, 2026-09-07): placement classes + singleton test.
# contract_version 3 (CR-034/CR-035, 2026-09-07): prefix_conventions replaced
#   yaml_naming; added dot_surface_levels, audit_lifecycle, stale_vs_junk; declared
#   _inbox/_tasks.yaml as source of truth with the working doc as a generated view.
# contract_version 2 (CR-010, 2026-04-29): added vault_conventions block.
#
# Bumps are additive — clients on contract_version 1 ignore the new block;
# clients on version 2 or later get the structured vault-file declarations.
contract_version: 16
core_skills_version: "1.46.0"

# --- Schema versions ---
# insights schema 2 (CR-013): adds optional `confidence` (hypothesis|rule),
# `confirmation_count`, `confirmations[]`, and `contradicted_by[]` fields per
# entry. Bump is additive — v1 readers ignore unknown fields.
schemas:
  ops_config: "1.3"
  contact_meta: "1.1"
  tasks: 2
  insights: 2

# --- Task status enum ---
# Declared here because it was not, and three other dialects grew in its
# absence: `open`/`done`, `todo`/`waiting`, and one-off words like
# `superseded`. A tool reading only the canonical set counted finished tasks
# as outstanding. The schema in the tasks skill has always said this; saying
# it here too is what makes it checkable.
task_statuses:
  active:
    - pending
    - in_progress
    - blocked
  finished:
    - completed
    - cancelled
  note: "A reader should tolerate an unknown status rather than treat it as active; a writer should emit only these."

# --- Insight type enums ---
insight_types:
  content:
    - decision
    - preference
    - learning
    - opportunity
    - pattern
    - quote
    - metric
  evolution:
    - edge_case
    - correction
    - skill_pattern

# --- Contact classification (CR-009) ---
contact_classification:
  levels:
    - family
    - personal
    - professional
    - confidential
  default: professional
  private_mapping:
    family: true
    personal: true
    professional: false
    confidential: false
  folder_pattern_defaults:
    family:
      - "_contacts/a1-*"
      - "_contacts/a2*"
    personal:
      - "_private/**"

# --- Skills registry ---
skills:
  user_invocable:
    - name: ops
      description: "Unified meeting and operations processing — config-driven for any organization."
      badge: Primary
      subcommands: [status, prepare, normalize, lint, sweep, help]
    - name: transcript
      description: "Process and summarize transcriptions from calls, meetings, or voice recordings."
      badge: Lightweight
    - name: preparation
      description: "Create structured meeting preparation documents with walk-in agenda card."
      badge: Context
    - name: tasks
      description: "Personal task tracker with cross-project correlation."
      badge: Tracking
      subcommands: [show, add, done, import, weekly, archive, migrate]
    - name: daily-dashboard
      description: "Daily meeting and task dashboard with quick-access symlinks."
      badge: Overview
    - name: insights
      description: "Knowledge extraction manager and skill evolution engine."
      badge: Knowledge
      subcommands: [reprocess, scan-claude-md, compile, normalize, synthesize, propose, status, help]
    - name: analytics
      description: "Vault-level content analytics — trends, skill adoption, contact engagement, backlog."
      badge: Knowledge
      subcommands: [overview, skills, contacts, pipeline, backlog, help]
    - name: inbox
      description: "Universal entry point for unstructured content — classifies and routes. Maintains the triage working surface (CR-022)."
      badge: Capture
      subcommands: [status, process, triage, help]
    - name: md2pdf
      description: "Convert markdown to styled PDFs. Supports Mermaid, tables, outbox packaging."
      badge: Utility
    - name: update-skills
      description: "Skill repo management — fetch, pull, symlink, health audit."
      badge: Utility
    - name: outbox
      description: "Lifecycle management for `_outbox/` items — list pending, archive resolved into contact/project folders."
      badge: Utility
      subcommands: [list, status, archive, archive --all-sent, help]
    - name: handoff
      description: "Frozen, self-contained context snapshots in `.handoff/` — bounded subjects a different work session can pick up cold. Human-actioned only; no skill reads them."
      badge: Utility
      subcommands: [list, read, help]
  non_invocable:
    - name: ops-base
      description: "Shared operational framework (meeting formats, task management, workflows)."
    - name: ops-config
      description: "Configuration system — schema definition and base defaults."

# --- Output artifacts ---
# (Legacy flat list kept for back-compat with contract_version 1 clients.
#  Newer clients should consume vault_conventions below for full semantics —
#  writers, readers, schemas, lifecycle.)
output_artifacts:
  per_folder:
    - "_insights.yaml"
    - "_tasks.yaml"
    - "CHANGELOG.md"
  vault_root:
    - "_analytics/"
    - "_inbox/"
    - "_outbox/"
    - "_Dashboard.md"
    - "_tasks.yaml"
    - "_tasks-history.md"

# --- Vault file conventions (CR-010) ---
# Authoritative declaration of every file the suite produces or consumes
# in a user's vault. Includes path pattern, purpose, schema link (when one
# exists), writers, readers, and lifecycle. Tools like Marvin, Trillian,
# Deep Thought adapters, and future skills should read this as the contract.
vault_conventions:

  # Files and folders that live at the vault root.
  vault_root:
    - path: "_inbox/"
      purpose: "Capture: unprocessed input awaiting classification"
      schema: "docs/schemas/inbox.md"
      writers: ["/inbox", "trillian", "deep-thought", "marvin"]
      readers: ["/inbox", "trillian", "marvin"]
      lifecycle: "append; items move to .archive/ after processing"

    - path: "CONTEXT.md"
      purpose: "Hand-written orientation at vault root: the frame the rest of the vault is read against — what is active, what is paused, which decisions are open, what governs the calendar. INDEX.md answers WHERE things live; CONTEXT.md answers WHAT APPLIES. Singleton (CR-036): there is one context, not one per folder"
      schema: null
      writers: ["user (manual)"]
      readers: ["user", "any session needing orientation"]
      lifecycle: "updated when something material changes — frame shift, new operative commitment, resolved blocker, closed track — never on a schedule"

    - path: "<folder>/.status/current.md"
      purpose: "Generated situational view for one contact or org person: meeting cadence over months, insight counts by type with the most recent named, open items, and the last movement from CHANGELOG. Answers 'where does this relationship stand' without reading a year of files. Lives in a HIDDEN subfolder so scanning skills cannot reach it — structural isolation rather than a skip flag, because CR-033 showed skip-lists are missed when skills glob on the YYMMDD- prefix"
      schema: null
      writers: ["render_status.py (generated)"]
      readers: ["user (read)"]
      lifecycle: "regenerated per folder after each new conversation; hand edits are lost"

    - path: "_inbox/_tasks.yaml"
      purpose: "Personal working tasks — SOURCE OF TRUTH (CR-035, supersedes CR-022 in part). Standard v2 task schema plus triage_id (preserves the {id} token used by external sync). task: states what is to be done and nothing else; history, references and reasoning go in notes:"
      schema: "tasks v2"
      writers: ["user (manual)", "import from _inbox/_capture.md", "a dashboard may append a captured task and mark one finished — those two fields only"]
      readers: ["/ops", "marvin", "external sync (todoist-task-pipeline)"]
      lifecycle: "append; status pending -> completed (see task_statuses); completed items archived to .archive/"

    - path: "_inbox/_inbox.yaml"
      purpose: "The inbox register: one entry per captured item, with its classification, routing and status. The markdown files in _inbox/ are the material; this is the index over them"
      schema: "inbox v2 — see docs/schemas/inbox.md"
      writers: ["/inbox", "a dashboard (capture and classification)"]
      readers: ["/inbox", "/analytics", "a dashboard"]
      lifecycle: "append on capture; status pending -> processed; processed entries archived with their files"

    - path: "_inbox/_capture.md"
      purpose: "Free-form write path for tasks (CR-035). One line each; import moves them into _tasks.yaml and empties this file. Syntax: @tag or [Tag] -> context, !P0..!P3 -> priority, clock+YYMMDD -> due"
      schema: null
      writers: ["user (manual)"]
      readers: ["import tooling"]
      lifecycle: "emptied on every import"

    - path: "_inbox/_frame.md"
      purpose: "Hand-written context (week anchor, frame, conventions) pasted verbatim into the generated view (CR-035), so the generator never owns prose"
      schema: null
      writers: ["user (manual)"]
      readers: ["view generator"]
      lifecycle: "edited in place"

    - path: "_inbox/<working-doc>.md"
      purpose: "GENERATED VIEW of _inbox/_tasks.yaml (CR-035). Shows overdue, today, tomorrow, P0/P1 without a date, and the coming seven days. NEVER hand-edited; tools must not write to it. Was the system of record under CR-022 until 260907"
      schema: null
      writers: ["view generator only"]
      readers: ["user (read)", "marvin"]
      lifecycle: "regenerated from _tasks.yaml"

    - path: "_inbox/.audio/"
      purpose: "Raw audio captured by Trillian, paired by basename with _inbox/<id>.md"
      schema: "docs/schemas/inbox.md"
      writers: ["trillian"]
      readers: ["trillian", "deep-thought", "user (manual)"]
      lifecycle: "kept indefinitely by default; user-configurable retention; archived to .archive/.audio/ alongside transcript"

    - path: "_inbox/.files/"
      purpose: "File drops: input files with a vault destiny, paired by basename with _inbox/<id>.md (CR-024)"
      schema: "docs/schemas/inbox.md"
      writers: ["user (manual drop)", "/inbox"]
      readers: ["/inbox", "downstream skills", "marvin"]
      lifecycle: "pass-through; on processing the file moves to the target folder's .attachments/ or to .archive/.files/"

    - path: ".knowledge/wiki/"
      purpose: "Knowledge wiki: topic articles synthesized from the insights corpus (CR-027)"
      schema: null  # article format defined in skills/insights/SKILL.md (synthesize)
      writers: ["/insights synthesize"]
      readers: ["any session answering knowledge questions (via INDEX.md)", "marvin (candidate)"]
      lifecycle: "living documents, topic-named; idempotent refresh from new insights; human-edited marker respected"

    - path: ".knowledge/INDEX.md"
      purpose: "Master knowledge index — read FIRST when answering knowledge questions (no RAG)"
      schema: null
      writers: ["/insights synthesize"]
      readers: ["any session", "marvin (candidate)"]
      lifecycle: "regenerated on every synthesize run; never hand-edited"

    - path: ".handoff/"
      purpose: "Frozen handoff snapshots: one bounded subject each, self-contained, human-actioned only (CR-033)"
      schema: null  # document structure defined in skills/handoff/SKILL.md
      writers: ["/handoff"]
      readers: ["user (explicit request only)", "/handoff read"]
      lifecycle: "written once, never updated, never archived, never indexed; ALL other skills must skip this folder entirely — no parse, index, summarise, sweep or lint"

    - path: ".ephemeral/"
      purpose: "Disposable working material with NO vault destiny (session scratch, snapshots, intermediates)"
      schema: null  # unstructured by design
      writers: ["any skill/session (scratch)"]
      readers: ["the session that created it"]
      lifecycle: "allowed to die; /ops sweep flags content >14 days; never referenced from vault content (CR-024)"

    - path: "_outbox/"
      purpose: "Staging for outgoing material (CR-047). One folder per send event, or a loose .md for a single message. Each folder carries a _manifest.md declaring status, channel, contact and canonical source — that manifest is the contract any dispatcher reads. Those are the FIELD NAMES; the label each is written under follows the vault language (a Swedish vault writes Status, Kanal, Kontakt, Kanonisk källa) and belongs in a dispatcher's vocabulary file, not in its code"
      schema: null  # filesystem layout, not YAML
      writers: ["/ops", "/md2pdf", "user (manual)"]
      readers: ["/outbox", "a dispatching surface (see outbound_dispatch.tools)", "vaultpulse/trillian", "the local mail client", "user"]
      lifecycle: "staged -> sent -> archived by /outbox into the contact or project folder; nothing auto-deletes. An item decided against never reaches Status: skickad and so is not picked up by `archive --all-sent` — see outbound_dispatch.known_gaps"

    - path: "_outbox/<item>/_manifest.md"
      purpose: "The per-item contract every dispatcher reads: status, channel, contact, canonical source. Declared in its own right because two different parties write it — the skill authors it, a dispatcher records only that it sent something"
      schema: "see the /outbox skill, which owns the vocabulary"
      writers: ["/outbox and /ops (author it)", "a dispatching surface (status, status-note, channel and contact only)"]
      readers: ["/outbox", "a dispatching surface", "user"]
      lifecycle: "written when the item is staged; Status advances as it moves; archived with its folder"

    - path: "<venture>/.chats/"
      purpose: "Chat archive from an external messaging platform (CR-047). Raw provider message objects, one JSON file per chat per day, plus a rendered .md per day and a _chat.json naming the meeting topic. A dot-folder so Obsidian ignores the raw data; the derived notes belong in the normal tree"
      schema: null  # Graph chatMessage objects, stored verbatim
      writers: ["the chat-archive tool"]
      readers: ["user", "any tool reading the rendered .md"]
      lifecycle: "append-only; re-fetching an overlapping range de-duplicates by message id. Placement is PER_BOUNDARY — it belongs to the venture whose tenant the chats came from, never to _private/"

    - path: "_infrastructure/"
      purpose: "The INTERNAL architecture: machines, topology, connectivity, who operates what from where. Named in prefix_conventions since CR-034 but never declared in its own right until CR-051"
      schema: null
      writers: ["user (manual)", "survey scripts (inventory snapshots)"]
      readers: ["user", "any session answering an operations question"]
      lifecycle: "a map file per layer plus dated surveys; the maps are stable, the surveys are snapshots and are not updated in place"
      placement: singleton

    - path: "_architecture/"
      purpose: "The EXTERNAL architecture: the software system — which components exist, which repository holds each, what reads and writes the vault, and where each configuration lives. The counterpart to _infrastructure/, which answers the same questions about machines"
      schema: "components: in this file is the generic source; _architecture/ maps it onto actual repositories"
      writers: ["user (manual)"]
      readers: ["user", "any session answering how the parts fit together"]
      lifecycle: "updated when a component is added, retired or moves between repositories"
      placement: singleton
      note: "Singleton by the CR-036 test: it describes the system as a whole, so a folder-scoped copy would describe nothing. Holds instance names — repositories, hosts, employers — which is exactly what this contract does not"

    - path: "_config/"
      purpose: "Vault-wide overrides for skill defaults (optional)"
      schema: "skills/ops-config/schema.md"
      writers: ["user (manual)"]
      readers: ["/ops", "/insights", "/tasks", "/analytics"]
      lifecycle: "stable; rarely changes"
      # Load-bearing as of v1.16.0 (CR-011): vault-wide override layer between folder-local _ops.yaml and skill base.yaml.

    - path: "_analytics/"
      purpose: "Dated snapshots of vault-level analytics"
      schema: null  # markdown reports + YAML data files
      writers: ["/analytics"]
      readers: ["marvin", "user"]
      lifecycle: "append; older snapshots auto-archived"

    - path: "_tasks.yaml"
      purpose: "Vault-root task aggregation (legacy from v1 schema)"
      schema: "tasks v2"
      writers: ["/tasks"]
      readers: ["/tasks", "/daily-dashboard", "marvin"]
      lifecycle: "deprecated in favour of per-folder _tasks.yaml; kept for back-compat"

    - path: "_INDEX-*.md"
      purpose: "Generated registers at vault root: what runs where, and which project maps to which machine. Swept from a machine list held outside the vault, so the vault is the view and not the source"
      schema: null
      writers: ["an inventory scanner (generated)"]
      readers: ["user", "any session answering an operations question"]
      lifecycle: "regenerated in full on each sweep — a hand edit is lost silently, which is why write_ownership names it GENERATED"
      placement: singleton

    - path: "_Dashboard.md"
      purpose: "Daily dashboard composition"
      schema: null  # markdown; structure documented in /daily-dashboard SKILL.md
      writers: ["/daily-dashboard"]
      readers: ["user", "marvin"]
      lifecycle: "regenerated daily"

  # Files that may appear in any folder in the vault.
  per_folder:
    - path: "<folder>/_ops.yaml"
      purpose: "Per-folder ops config (org config, team, language, terminology)"
      schema: "skills/ops-config/schema.md"
      writers: ["user (manual)"]
      readers: ["/ops", "/insights", "/tasks", "/analytics", "/daily-dashboard"]
      lifecycle: "stable; rarely changes"
      # Canonical location as of v1.16.0 (CR-011). Pre-v1.16.0 configs lived in ~/.claude/skills/{org}-ops-config/; that fallback is removed in v1.17.0.

    - path: "<folder>/_tasks.yaml"
      purpose: "Per-folder open tasks (v2 distributed)"
      schema: "tasks v2"
      writers: ["/tasks", "/transcript", "/ops"]
      readers: ["/tasks", "/daily-dashboard", "marvin"]
      lifecycle: "live; tasks added/completed/archived in place. MAY BE ABSENT BY DECLARATION (CR-040): see workflows.task_ledger — absence is then deliberate, and the work is tracked in the declared external system"

    - path: "<folder>/_insights.yaml"
      purpose: "Extracted decisions, learnings, patterns, evolution feedback"
      schema: "insights v1"
      writers: ["/insights", "/ops", "/transcript"]
      readers: ["/insights", "/analytics", "marvin"]
      lifecycle: "append-mostly; auto-applied edits via /insights propose"

    - path: "<folder>/_meta.yaml"
      purpose: "Folder metadata (esp. _contacts/<name>/ classification)"
      schema: "contact-meta v1.1"
      writers: ["user (manual)", "/ops"]
      readers: ["/ops", "/insights", "/analytics", "/daily-dashboard"]
      lifecycle: "stable"

    - path: "<folder>/_summary.yaml"
      purpose: "Folder-level narrative summary (CR-008, generated by Ollama)"
      schema: "docs/schemas/summary-yaml.md"
      writers: ["scripts/generate_summaries.py (Marvin)"]
      readers: ["marvin", "user"]
      lifecycle: "regenerated when stale (cron-restart 04:00 daily)"

    - path: "<folder>/CHANGELOG.md"
      purpose: "Per-folder changelog of structural changes"
      schema: null  # plain markdown
      writers: ["/ops normalize", "user", "/ops"]
      readers: ["user"]
      lifecycle: "append"

    - path: "<folder>/rolling-plan-<facilitator>-<partner>.md"
      purpose: "Living per-axis planning doc for a recurring 1-on-1 (CR-014); registered in _ops.yaml workflows.rolling_plans"
      schema: "skills/ops-config/schema.md (Rolling Plans); template skills/ops-config/templates/rolling-plan.md"
      writers: ["/ops", "user"]
      readers: ["/ops", "/daily-dashboard", "user"]
      lifecycle: "live; participant-triggered update after a matching 1-on-1; completed rows move into the meeting summary"

  # Cross-cutting rules that govern multiple files.
  rules:
    # --- Rule hierarchy (CR-037) ---
    # Every rule below declares level:. A rule without one is a CONTRACT DEFECT,
    # not a guideline by default — the absence must be loud.
    #
    #   invariant  never broken; no exception possible          -> sweep: finding
    #   rule       holds generally; exceptions must be NAMED
    #              in exceptions: and justified                 -> sweep: finding
    #                                                              unless exempted
    #   guideline  intended shape; judgement may override       -> sweep: warning
    #
    # Conflict resolution, in order:
    #   1. Higher level wins: invariant > rule > guideline.
    #   2. Within a level, the more specific wins (a rule naming a path beats
    #      one naming a class).
    #   3. A declared exception beats the rule it exempts — only for the named
    #      surface, and never against an invariant.
    #   4. Two rules of equal specificity in conflict = CONTRACT DEFECT. Report
    #      it; do not choose. Silent resolution is how the .knowledge/ prefix
    #      inconsistency survived review on 260907.

    - id: "vault_relative"
      level: invariant
      rule: "All paths above are vault-relative. The vault root is determined by walking up from CWD until _inbox/, _outbox/, or .obsidian/ is found, or by VAULT_ROOT env var, or by a tool-specific override."

    - id: "placement_classes"
      level: rule
      rule: "Every declared path belongs to exactly one placement class (CR-036). SINGLETON — exactly one, at vault root; a second instance is a finding: INDEX.md, _inbox/, _outbox/, _config/, .handoff/, .knowledge/. PER_FOLDER — appears in every folder of its kind: _meta.yaml, _insights.yaml, _tasks.yaml, _manifest.md, .archive/. PER_FOLDER presence can be CONDITIONAL (CR-040): a folder declaring workflows.task_ledger.mode external or none legitimately has no _tasks.yaml, and that absence is a declaration, not missing data — readers must not treat it as an empty or stalled folder. PER_BOUNDARY — appears where the boundary it describes actually applies: CLAUDE.md, _ops.yaml, CHANGELOG.md, README.md."

    - id: "singleton_surfaces"
      level: invariant
      surfaces: ["INDEX.md", "CONTEXT.md", "_inbox/", "_outbox/", "_config/", ".handoff/", ".knowledge/", ".transcripts/", ".ephemeral/"]
      rule: "The test for singleton status is stronger than counting instances: would a SECOND, FOLDER-SCOPED instance defeat the reason the surface exists? (CR-036). .handoff/ is outward-facing, self-carrying and holds no vault links (CR-033) — a scoped copy would make the snapshot inherit a context it is built to survive without. .knowledge/ synthesises ACROSS sources with INDEX.md as the single entry point (CR-027) — a scoped copy would prevent the cross-source synthesis that justifies the layer. RESOLVED 260907: .transcripts/ and .ephemeral/ are now singleton. Both had scoped copies — .transcripts/ one level down (consolidated to root under human authorisation, with relative links repaired in the same operation) and .ephemeral/ in three places (all empty, removed). Read-blocked content is only ever relocated on explicit human instruction, never by a skill acting on its own; the link repair is part of the same operation because a moved read-blocked file whose references still point at the old path is worse than the duplication it fixed."

    - id: "changelog_readme_conditions"
      level: guideline
      rule: "CHANGELOG.md belongs only where history is actually kept — contacts, organisations, projects, products. A CHANGELOG in a folder that never retires anything is noise (observed: 130 of 174 have no sibling .archive/). README.md belongs only where a folder needs explaining to someone OTHER THAN its author (observed: 269 instances). Forward-looking: governs new folders, and is a sweep WARNING rather than an error. INDEX.md is root plus generated registers only."

    - id: "single_inbox_outbox"
      level: invariant
      rule: "Exactly one _inbox/ and exactly one _outbox/ per vault, both at vault root. Per-folder inboxes/outboxes are not part of this contract."

    - id: "config_resolution_order"
      level: invariant
      rule: "/ops resolves config in this order: project-level .claude/ops-config.yaml > nearest <folder>/_ops.yaml walking up from CWD > <vault>/_config/base.yaml > skill base.yaml. First match wins. Implemented in v1.16.0 (CR-011). The pre-v1.16.0 chain (~/.claude/skills/{org}-ops-config/{org}.yaml) is deprecated and removed in v1.17.0; until then it acts as a fallback between vault-wide and skill defaults with a one-time per-session deprecation warning."

    - id: "prefix_conventions"
      level: rule
      exceptions: [".knowledge/", ".handoff/_archive"]
      rule: "The prefix answers ONE question: is this surface READ in everyday work? (CR-034). Underscore = read routinely, sorts first: folders (_inbox/, _outbox/, _contacts/, _config/, _private/, _products/, _infrastructure/, _analytics/) and structure-bearing files that recur in every folder of a kind (_tasks.yaml, _insights.yaml, _meta.yaml, _manifest.md, _ops.yaml, _INDEX-*, _PLAN-*). Dot = read rarely, on demand, or never. Archive is ALWAYS .archive, never _archive. A dated post never takes underscore — it takes YYMMDD-."
      test: "is this surface read in everyday work? yes -> underscore, no -> dot"
      not_a_prefix_criterion: "WHO WRITES the surface is a separate property, declared per path, and never a reason for a prefix. _insights.yaml settles this: it is machine-written by /insights yet carries an underscore, because several skills READ it automatically. Generated does not imply dot."

    - id: "prefix_known_exception"
      level: rule
      rule: ".knowledge/ is READ frequently — INDEX.md is the documented first stop for any knowledge question — so by the rule above it would take an underscore. It keeps the dot for compatibility: the name is established in CR-027, INDEX.md, vault CLAUDE.md and every [[wiki]] link, and renaming costs more than the consistency gains. Declared here as a KNOWN EXCEPTION rather than hidden behind a rule it breaks. Do not cite .knowledge/ as precedent for dot-prefixing a new read surface. SECOND DECLARED EXCEPTION: .handoff/_archive keeps its underscore against the archive-is-always-.archive rule, because .handoff/ carries a TOTAL BLOCK (CR-033) — the surface is not touched by any skill, including to rename it. Exception by necessity, not by preference."

    - id: "dot_surface_levels"
      level: invariant
      rule: "Dot surfaces are of two kinds and skills must treat the second as a typed category, not a list of names. DORMANT (.archive/, .notes/, .ephemeral/): present, rarely read, safe to read on demand. BLOCKED — read access itself is constrained: .transcripts/ = read-block, never read back unattended and never quoted into summaries or insights; .handoff/ = total block, untouched by ops/insights/analytics/sweep/lint/normalize, never indexed, read only when named (CR-033). A new blocked surface must inherit the behaviour without patching each skill. NOTE: .knowledge/wiki/ is NOT blocked — it is read freely and often. Its constraint is WRITE-side (generated, hand-editing forbidden, owned by /insights synthesize, CR-027), which is a different axis; see prefix_known_exception."

    - id: "generated_view_isolation"
      level: rule
      rule: "A generated READ view that lives among its own source material must be isolated STRUCTURALLY, not by a skip flag. Put it in a hidden subfolder (<folder>/.status/current.md) rather than beside the sources as <folder>/_status.md. Reason: CR-033 found four skills reaching .handoff/ files despite an explicit skip-list, because they globbed on the YYMMDD- filename prefix rather than consulting the list. A per-folder markdown file among meeting documents is easier to hit by accident than one in a dot-folder. The dot here does not mean rarely read — the user opens it deliberately; it means unreachable by scanners, which is the .knowledge/wiki/ pattern applied at folder scope."

    - id: "system_file_language"
      level: rule
      rule: "System and structure files carry ENGLISH names regardless of the language of their content: _config/priority.md, _config/naming-prefix.md, _inbox/_frame.md, .status/current.md. Content stays in the vault's working language. Applies going FORWARD — the derived registers with Swedish names (_INDEX-agare.md, _INDEX-koppling.md, _INDEX-maskiner.md, _INDEX-objektmodell.md, _INDEX-verksamheter.md) are read by scripts and renaming them costs more than the consistency gains; the generated wiki articles under .knowledge/wiki/ likewise keep the language of the corpus they summarise."

    - id: "identifier_language"
      level: rule
      rule: "Identifiers are ENGLISH; the words a person reads may be in any language, and are data rather than literals in code. This covers schema field names, enum values, status keys, config keys, dictionary keys and variable names — everything a second tool must agree with in order to interoperate. Display text (a manifest's Status wording, an external board's column name, a generated view's headings) stays in the vault's working language and lives in a settings or vocabulary file, so changing it is a settings change rather than a code change. Where an identifier and its label were historically the same string, the LABEL keeps the existing spelling: renaming a key costs nothing, while renaming a label changes what an external system or a person sees. A reader meeting a value it does not recognise should tolerate it rather than silently treat it as the default — see task_statuses, where recognising only the canonical set made finished tasks count as outstanding. THIS DECLARATION FOLLOWS ITS OWN RULE: where a field is named here, it is named by its identifier, not by the label a vault happens to write it under. Five entries described a manifest's fields as Status/Kanal/Kontakt until 2026-09-21, which reads as Swedish identifiers in a public contract and invites a tool to hardcode the label."

    - id: "write_ownership"
      level: rule
      rule: "Independent of the prefix, every surface declares who may write it. HUMAN: _inbox/_capture.md, _inbox/_frame.md, _meta.yaml, .handoff/ (once, then frozen). GENERATED — hand-editing forbidden: .knowledge/wiki/ (/insights synthesize, CR-027), _INDEX-maskiner.md and _INDEX-koppling.md (scan.py), the personal working-document view (CR-035). MIXED: _tasks.yaml, _insights.yaml. A generated surface that is edited by hand loses its next regeneration silently — which is why the property is declared rather than inferred from the prefix."

    - id: "audit_lifecycle"
      level: rule
      rule: "An audit or review document lives in _inbox/ only WHILE IN USE. Once its decisions are made and executed it moves to _inbox/.archive/. An audit left in place after execution becomes a competing source of truth against the working document (observed 260907). _inbox/ normally holds at most three CONTENT files: the working document, one active audit, one active review. Declared system files do not count against the ceiling (_capture.md, _frame.md, _inbox.yaml, _tasks.yaml) — they are infrastructure of the surface, not material passing through it. More than three content files means something has taken up residence, which CR-025 forbids in principle but does not measure."

    - id: "stale_vs_junk"
      level: rule
      rule: "Stale is not junk. A document that WAS current and is now outdated is archived to .archive/ (never deleted). Material with no vault destination goes to .ephemeral/ and may die (swept after 14 days, CR-024). Conflating the two loses history or retains rubbish."

    - id: "audio_transcript_pairing"
      level: invariant
      rule: "Audio in _inbox/.audio/<basename>.m4a and the matching transcript at _inbox/<basename>.md are paired by basename. Tools that rename one must rename the other. Detailed in CR-012."

# --- Visualisation app features ---
# --- Outbound dispatch (CR-047) ---
# How staged material actually leaves the vault. The skills author it; separate
# tools deliver it. Declared here so a reader knows these tools exist and what
# they are permitted to touch.
outbound_dispatch:
  contract: "_outbox/<item>/_manifest.md — see vault_conventions for the path declaration"

  tools:
    - name: "the dashboard"
      kind: "external app, outside this repo"
      role: "Reads the vault and serves it: tasks, insights, activity — and the outbox, where staged material is previewed and dispatched through a channel"
      reads: ["_outbox/", "the vault generally"]
      writes: ["_outbox/<item>/_manifest.md — the status, status-note, channel and contact fields only"]
      never: "Authors a manifest, decides what a status means, or archives. Archiving is /outbox's: eight steps across several files with judgement calls. The status-note is an exception that proves the rule — a dispatcher may record WHAT IT DID first-hand (channel, time, which recipient, a message id) because that is observation, not judgement; it may not write what that outcome MEANS for the item"
      note: "Dispatch began as a separate tool and was merged in 2026-09-21. Two surfaces for one workflow was the wrong shape once the dashboard could write at all. It binds to localhost, because it can now send as the user"

    - name: "chat-archive/send CLI"
      kind: "external library + CLI, outside this repo"
      role: "Messaging-platform client: delegated auth, chat messages, Markdown to the platform's markup"
      reads: ["chats the signed-in user belongs to"]
      writes: ["<venture>/.chats/ — the archive", "chat messages"]
      never: "Knows nothing about vaults or manifests. The dashboard imports it as the messaging channel; it is a dependency of vault-aware code, not an instance of it"

  channels:
    - name: "teams"
      via: "the chat CLI, delegated as the signed-in user"
      scopes: "delegated chat read/send plus own-profile; no application-only access"
      status: "in use"
    - name: "email"
      via: "the local mail client, composing a draft — never sending. Where the client cannot be driven (a background supervisor), writes a .eml the user opens"
      scopes: []
      status: "in use; a draft always requires a human to press send"

  known_gaps:
    - id: "archive-of-unsent-items"
      what: "/outbox archive requires a sent status, so an item decided against — marked as superseded, replaced or withdrawn — can never be archived and stays in _outbox indefinitely"
      seen: "a steady residue of stop-marked items that nothing files"
      proposal: "Treat a stop-marked manifest as archivable when its outcome section states why. That section already exists (written `## Utfall` in a Swedish vault), and 'not sent, because X' is an outcome"
      owner: "/outbox skill — the dispatcher must not invent a status the skill does not recognise"

# --- Components and how they connect (CR-050) ---
#
# vault_conventions declares how each part touches FILES. This declares how the
# parts touch EACH OTHER: what imports what, what calls out to a third-party
# service, and which direction each dependency runs.
#
# Written after three writers/readers rows went stale within hours of being
# true, and after a question that had no single answer: "where is the full
# picture documented?" It was spread across five places, none of them machine
# readable.
#
# Kinds are ROLES, not product names. This file is public and describes a
# framework, so a component is "a dashboard", not an instance. An installation
# maps its own tools onto these roles; the private map of which repo plays
# which role belongs beside that installation, not here.
components:
  - id: "skills"
    kind: "instruction sets loaded into a session"
    role: "The framework itself. Read and write vault files; hold what each file MEANS"
    reads: ["the vault, per vault_conventions"]
    writes: ["the vault, per vault_conventions"]
    depends_on: []
    note: "A skill cannot start a session — it is loaded INTO one. Anything that must start something is a tool, not a skill"

  - id: "dashboard"
    kind: "local web application"
    role: "Reads the vault and serves it: tasks, insights, activity, and the outbox where staged material is dispatched"
    reads: ["the vault broadly"]
    writes:
      - "_inbox/_tasks.yaml — appends a captured task, marks one finished"
      - "_inbox/_inbox.yaml — capture items"
      - "_outbox/<item>/_manifest.md — the status, status-note, channel and contact fields only"
      - "<folder>/_summary.yaml — its own derived cache"
    depends_on: ["messaging client (as a library, for the chat channel)"]
    binds: "localhost only — it can send as the user"
    note: "Not read-only, and has not been since it gained the outbox. What it may write is deliberately narrower than what it may read"

  - id: "messaging client"
    kind: "library plus CLI"
    role: "Talks to a chat platform: delegated auth, read and send messages, Markdown to the platform's markup"
    reads: ["chats the signed-in user belongs to"]
    writes: ["<venture>/.chats/ — the archive", "chat messages"]
    depends_on: ["an auth library", "an HTTP library"]
    note: "Knows nothing about vaults or manifests. A dependency of vault-aware code, not an instance of it — which is why it is its own component rather than part of the dashboard"

  - id: "task pipeline"
    kind: "local scripts, run on demand"
    role: "Keeps an external task service in step with the vault's task ledger"
    reads: ["_inbox/_tasks.yaml", "_inbox/_capture.md", "_inbox/_frame.md"]
    writes: ["_inbox/_tasks.yaml", "the generated triage view", "the external service"]
    depends_on: ["an external task service (one script only)"]
    note: "The vault is the source of truth; the external service is a mirror. Only one of its scripts reaches the service at all — the rest never leave the vault"

  - id: "capture app"
    kind: "companion application"
    role: "Drops captured material into the vault from outside a session"
    reads: []
    writes: ["_inbox/", "_inbox/.audio/"]
    depends_on: []

  - id: "inventory scanner"
    kind: "local script, run on demand"
    role: "Sweeps the machines a vault describes and regenerates the registers that say what runs where"
    reads: ["its own machine list — the source of truth for which machines exist"]
    writes: ["_INDEX-*.md — the generated machine and mapping registers"]
    depends_on: []
    note: "The one component that bridges the two maps: its INPUT is infrastructure and its OUTPUT is a vault file. Generated — hand-editing a register loses it on the next sweep"

  - id: "landing page"
    kind: "public website"
    role: "Explains the framework and how to install it"
    reads: ["this file, fetched from the public repo"]
    writes: []
    depends_on: ["this contract"]
    note: "A CONSUMER of the contract, never a source of it. The dependency runs contract -> site; inverting it would make the framework depend on a website"

# How to read the graph above:
#   - `depends_on` is a build/runtime dependency: A cannot work without B.
#   - Two components that only share a vault file are NOT dependent. They are
#     coupled through the file, and vault_conventions is where that is declared.
#     This is the point of the split: a file is a contract between components,
#     so they need not know about each other.
#   - A cycle in depends_on is a defect. The landing page depending on the
#     contract while the contract knows nothing of the landing page is correct.

visualisation_features:
  - id: dashboard
    label: Dashboard
  - id: inbox
    label: Inbox
  - id: tasks
    label: Task Board
  - id: projects
    label: Projects
  - id: documents
    label: Documents
  - id: insights
    label: Insights
  - id: analytics
    label: Analytics
  - id: mcp
    label: MCP Server
