      lifecycle: "allowed to die; /ops sweep flags content >14 days; never referenced from vault content (CR-024)"

    - path: "_outbox/"
      purpose: "Staging for outgoing material (CR-047). One folder per send event, or a loose .md for a single message. Each folder carries a _manifest.md declaring status, channel, contact and canonical source — that manifest is the contract any dispatcher reads. Those are the FIELD NAMES; the label each is written under follows the vault language (a Swedish vault writes Status, Kanal, Kontakt, Kanonisk källa) and belongs in a dispatcher's vocabulary file, not in its code"
      schema: null  # filesystem layout, not YAML
      writers: ["/ops", "user (manual)", "any tool that writes a manifest per this contract"]
      readers: ["/outbox", "a dispatching surface (see outbound_dispatch.tools)", "vaultpulse/trillian", "the local mail client", "user"]
      lifecycle: "staged -> sent -> closed by /outbox into the contact or project folder; nothing auto-deletes. An item decided against never reaches Status: skickad and so is not picked up by `close --all-sent` — see outbound_dispatch.known_gaps"

    - path: "_outbox/<item>/_manifest.md"
      purpose: "The per-item contract every dispatcher reads: status, channel, contact, classification, canonical source. Declared in its own right because two different parties write it — the skill authors it, a dispatcher records only that it sent something"
      classification: "Who may RECEIVE the item, as distinct from where it is going (channel/contact). Values, most to least permissive: team-wide-safe (anyone internal — the default when absent), team-only (the working team; not interns or contractors) and management-only (named recipients, not a group — CR-070). The order is part of the declaration, not an inference: the first two scale a group, the third leaves group distribution, and widening from it into any channel is the step that turns individual assessment into a group communication. Authored by the skill and READ-ONLY to a dispatcher: a dispatching surface may write channel and contact, so without this an operator can widen the audience of an item never written for it, and nothing in the file objects. A dispatcher WARNS and requires confirmation when a send would widen beyond the declared value; it does not refuse, because refusing is enforcing policy and that is not a dispatcher's to decide (CR-047)"
      schema: "see the /outbox skill, which owns the vocabulary"
      writers: ["/outbox and /ops (author it)", "a dispatching surface (status, status-note, channel and contact only)"]
      readers: ["/outbox", "a dispatching surface", "user"]
      lifecycle: "written when the item is staged; Status advances as it moves; archived with its folder"

    - path: "<venture>/.teamschats/"
      purpose: "Chat archive from an external messaging platform (CR-047). Raw provider message objects, one JSON file per chat per day, plus a rendered .md per day and a _chat.json naming the meeting topic. A dot-folder so Obsidian ignores the raw data; the derived notes belong in the normal tree"
      schema: null  # Graph chatMessage objects, stored verbatim
      writers: ["the chat-archive tool"]
      readers: ["user", "any tool reading the rendered .md"]
      lifecycle: "append-only; re-fetching an overlapping range de-duplicates by message id. Placement is PER_BOUNDARY — it belongs to the venture whose tenant the chats came from, never to _private/"

    - path: "<venture>/.teamschats/_fetch.json"
      purpose: "The fetch record for the archive: when it was last fetched, and whether that worked. Tells a quiet source (fetched, nothing new) from a stale one (not fetched) and a broken one (the fetch failed, often on an expired login) — three states a snapshot date alone prints identically"
      schema: null  # JSON object; fields listed in lifecycle
      writers: ["the chat-archive tool"]
      readers: ["any tool"]
      lifecycle: "Written atomically by the fetcher, by a scheduled run and a run started by hand alike. Fields: source, last_attempt, last_success (kept across failures), result (ok | partial | auth_required | error | timeout — a reader treats an unknown value as error), detail (one line for a person; never a token, a signed URL or message content), host, tool (CR-088). Overwritten on every attempt"
      placement: per_boundary
      note: "Readable although its folder is not routinely read (CR-034): it holds timestamps and a status, nothing from the source. A reader opens this one file by name and nothing else in the folder. A missing record is reported as `fetch not recorded`, never omitted (CR-071)"

    - path: "_infrastructure/"
      purpose: "The INTERNAL architecture: machines, topology, connectivity, who operates what from where. Named in prefix_conventions since CR-034 but never declared in its own right until CR-051"
      schema: null
      writers: ["user (manual)", "survey scripts (inventory snapshots)"]
      readers: ["user", "any session answering an operations question"]
      lifecycle: "a map file per layer plus dated surveys; the maps are stable, the surveys are snapshots and are not updated in place"
