      schema: null
      writers: ["the repo metadata archiver"]
      readers: ["user", "any session asking what changed in a repository"]
      lifecycle: "one snapshot per day per repository; a second fetch that day replaces it, because issue state is a reading taken at a moment rather than an event"
      placement: per_boundary
      note: "Sibling of <venture>/.teamschats/ and deliberately the same shape. A dot-folder, so the raw data is skipped by rule rather than by luck"

    - path: "<venture>/.githubmeta/_fetch.json"
      purpose: "The fetch record for the archive: when it was last fetched, and whether that worked. Tells a quiet source (fetched, nothing new) from a stale one (not fetched) and a broken one (the fetch failed, often on an expired login) — three states a snapshot date alone prints identically"
      schema: null  # JSON object; fields listed in lifecycle
      writers: ["the repo metadata archiver"]
      readers: ["any tool"]
      lifecycle: "Written atomically by the fetcher, by a scheduled run and a run started by hand alike. Fields: source, last_attempt, last_success (kept across failures), result (ok | partial | auth_required | error | timeout — a reader treats an unknown value as error), detail (one line for a person; never a token, a signed URL or message content), host, tool (CR-088). Overwritten on every attempt"
      placement: per_boundary
      note: "Readable although its folder is not routinely read (CR-034): it holds timestamps and a status, nothing from the source. A reader opens this one file by name and nothing else in the folder. A missing record is reported as `fetch not recorded`, never omitted (CR-071)"

    - path: "<venture>/.jirameta/"
      purpose: "Issue-tracker metadata archive: issues with their status, assignee and dates, plus released versions. One folder per board, a manifest saying what it is, a dated snapshot, a rendered .md, and a status.md holding current state. Metadata only — never descriptions or comment threads"
      schema: null
      writers: ["the jira metadata archiver"]
      readers: ["user", "any session asking where a board stands"]
      lifecycle: "one snapshot per day per board; a second fetch that day replaces it, because issue state is a reading taken at a moment rather than an event. status.md is rewritten on every fetch; the dated files are the record"
      placement: per_boundary
      note: "Third archive in the shape CR-047 set and CR-055 followed: what was said (.teamschats/), what shipped (.githubmeta/), what is tracked (.jirameta/). A capped fetch declares itself partial rather than recording a truncated board as a complete one (CR-074)"

    - path: "<venture>/.jirameta/_fetch.json"
      purpose: "The fetch record for the archive: when it was last fetched, and whether that worked. Tells a quiet source (fetched, nothing new) from a stale one (not fetched) and a broken one (the fetch failed, often on an expired login) — three states a snapshot date alone prints identically"
      schema: null  # JSON object; fields listed in lifecycle
      writers: ["the jira metadata archiver"]
      readers: ["any tool"]
      lifecycle: "Written atomically by the fetcher, by a scheduled run and a run started by hand alike. Fields: source, last_attempt, last_success (kept across failures), result (ok | partial | auth_required | error | timeout — a reader treats an unknown value as error), detail (one line for a person; never a token, a signed URL or message content), host, tool (CR-088). Overwritten on every attempt"
      placement: per_boundary
      note: "Readable although its folder is not routinely read (CR-034): it holds timestamps and a status, nothing from the source. A reader opens this one file by name and nothing else in the folder. A missing record is reported as `fetch not recorded`, never omitted (CR-071)"

    - path: "_config/"
      purpose: "Vault-wide overrides for skill defaults (optional)"
      schema: "skills/ops-config/schema.md"
      writers: ["user (manual)"]
      readers: ["/ops", "/insights", "/tasks", "/analytics"]
