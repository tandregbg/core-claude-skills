  # Files that may appear in any folder in the vault.
  per_folder:
    - path: "<folder>/_ops.yaml"
      purpose: "Per-folder ops config (org config, team, language, terminology)"
      schema: "skills/ops-config/schema.md"
      writers: ["user (manual)", "a dispatching surface may add an external_systems.chats entry, on explicit confirmation and nothing else"]
      note: "The file is hand-written and /ops owns its schema. The one exception is narrow and deliberate: a dispatcher knows first-hand which chat an item was actually sent to, and a chat picked from a live listing of seventy is where a wrong guess costs most. It may offer to record that ONE fact, showing the exact lines first, and may never write on send or infer anything else"
      readers: ["/ops", "/insights", "/tasks", "/analytics"]
      lifecycle: "stable; rarely changes"
      # Canonical location as of v1.16.0 (CR-011). Pre-v1.16.0 configs lived in ~/.claude/skills/{org}-ops-config/; that fallback is removed in v1.17.0.

    - path: "<folder>/_tasks.yaml"
      purpose: "Per-folder open tasks (v2 distributed)"
      schema: "tasks v2"
      writers: ["/tasks", "/transcript", "/ops"]
      readers: ["/tasks", "marvin"]
      lifecycle: "live; tasks added/completed/archived in place. MAY BE ABSENT BY DECLARATION (CR-040): see workflows.task_ledger — absence is then deliberate, and the work is tracked in the declared external system"

    - path: "<folder>/_insights.yaml"
      purpose: "Extracted decisions, learnings, patterns, evolution feedback"
      schema: "insights v1"
      writers: ["/insights", "/ops", "/transcript"]
      readers: ["/insights", "/analytics", "marvin"]
      lifecycle: "append-mostly; auto-applied edits via /insights propose"

    - path: "<folder>/_meta.yaml"
      purpose: "Folder metadata (esp. _contacts/<name>/ classification)"
      schema: "contact-meta v1.1"
      writers: ["user (manual)", "/ops"]
      readers: ["/ops", "/insights", "/analytics"]
      lifecycle: "stable"

    - path: "<folder>/_summary.yaml"
      purpose: "Folder-level narrative summary (CR-008, generated by Ollama)"
      schema: "docs/schemas/summary-yaml.md"
      writers: ["scripts/generate_summaries.py (Marvin)"]
      readers: ["marvin", "user"]
      lifecycle: "regenerated when stale (cron-restart 04:00 daily)"

    - path: "<folder>/CHANGELOG.md"
      purpose: "Per-folder changelog of structural changes"
      schema: null  # plain markdown
      writers: ["/ops normalize", "user", "/ops"]
      readers: ["user"]
      lifecycle: "append"

    - path: "<folder>/rolling-plan-<facilitator>-<partner>.md"
      purpose: "Living per-axis planning doc for a recurring 1-on-1 (CR-014); registered in _ops.yaml workflows.rolling_plans"
      schema: "skills/ops-config/schema.md (Rolling Plans); template skills/ops-config/templates/rolling-plan.md"
      writers: ["/ops", "user"]
      readers: ["/ops", "user"]
      lifecycle: "live; participant-triggered update after a matching 1-on-1; completed rows move into the meeting summary"

  # Cross-cutting conventions that govern multiple files (CR-092: key was `rules`).
  conventions:
    # --- Level hierarchy (CR-037; middle level renamed rule -> standard by CR-092) ---
    # Every convention below declares level:. One without it is a CONTRACT DEFECT,
    # not a guideline by default — the absence must be loud.
    #
    #   invariant  never broken; no exception possible          -> sweep: finding
    #   standard   holds generally; exceptions must be NAMED
    #              in exceptions: and justified                 -> sweep: finding
    #                                                              unless exempted
    #   guideline  intended shape; judgement may override       -> sweep: warning
    #
    # Conflict resolution, in order:
    #   1. Higher level wins: invariant > standard > guideline.
    #   2. Within a level, the more specific wins (a rule naming a path beats
    #      one naming a class).
    #   3. A declared exception beats the rule it exempts — only for the named
    #      surface, and never against an invariant.
    #   4. Two rules of equal specificity in conflict = CONTRACT DEFECT. Report
    #      it; do not choose. Silent resolution is how the .knowledge/ prefix
    #      inconsistency survived review on 260907.

    - id: "vault_relative"
      level: invariant
      rule: "All paths above are vault-relative. The vault root is determined by walking up from CWD until _inbox/, _outbox/, or .obsidian/ is found, or by VAULT_ROOT env var, or by a tool-specific override."

    - id: "placement_classes"
      level: standard
      rule: "Every declared path belongs to exactly one placement class (CR-036). SINGLETON — exactly one, at vault root; a second instance is a finding: INDEX.md, _inbox/, _outbox/, _config/, .handoff/, .knowledge/. PER_FOLDER — appears in every folder of its kind: _meta.yaml, _insights.yaml, _tasks.yaml, _manifest.md, .archive/. PER_FOLDER presence can be CONDITIONAL (CR-040): a folder declaring workflows.task_ledger.mode external or none legitimately has no _tasks.yaml, and that absence is a declaration, not missing data — readers must not treat it as an empty or stalled folder. PER_BOUNDARY — appears where the boundary it describes actually applies: CLAUDE.md, _ops.yaml, CHANGELOG.md, README.md."

    - id: "singleton_surfaces"
      level: invariant
      surfaces: ["INDEX.md", "CONTEXT.md", "_inbox/", "_outbox/", "_config/", ".handoff/", ".knowledge/", ".transcripts/", ".ephemeral/"]
      rule: "The test for singleton status is stronger than counting instances: would a SECOND, FOLDER-SCOPED instance defeat the reason the surface exists? (CR-036). .handoff/ is outward-facing, self-carrying and holds no vault links (CR-033) — a scoped copy would make the snapshot inherit a context it is built to survive without. .knowledge/ synthesises ACROSS sources with INDEX.md as the single entry point (CR-027) — a scoped copy would prevent the cross-source synthesis that justifies the layer. RESOLVED 260907: .transcripts/ and .ephemeral/ are now singleton. Both had scoped copies — .transcripts/ one level down (consolidated to root under human authorisation, with relative links repaired in the same operation) and .ephemeral/ in three places (all empty, removed). Read-blocked content is only ever relocated on explicit human instruction, never by a skill acting on its own; the link repair is part of the same operation because a moved read-blocked file whose references still point at the old path is worse than the duplication it fixed."

    - id: "changelog_readme_conditions"
      level: guideline
      rule: "CHANGELOG.md belongs only where history is actually kept — contacts, organisations, projects, products. A CHANGELOG in a folder that never retires anything is noise (observed: 130 of 174 have no sibling .archive/). README.md belongs only where a folder needs explaining to someone OTHER THAN its author (observed: 269 instances). Forward-looking: governs new folders, and is a sweep WARNING rather than an error. INDEX.md is root plus generated registers only."

    - id: "single_inbox_outbox"
      level: invariant
      rule: "Exactly one _inbox/ and exactly one _outbox/ per vault, both at vault root. Per-folder inboxes/outboxes are not part of this contract."

    - id: "config_resolution_order"
      level: invariant
      rule: "/ops resolves config in this order: project-level .claude/ops-config.yaml > nearest <folder>/_ops.yaml walking up from CWD > <vault>/_config/base.yaml > skill base.yaml. First match wins. Implemented in v1.16.0 (CR-011). The pre-v1.16.0 chain (~/.claude/skills/{org}-ops-config/{org}.yaml) is deprecated and removed in v1.17.0; until then it acts as a fallback between vault-wide and skill defaults with a one-time per-session deprecation warning."

    - id: "prefix_conventions"
      level: standard
      exceptions: [".knowledge/", ".handoff/_archive"]
      rule: "The prefix answers ONE question: is this surface READ in everyday work? (CR-034). Underscore = read routinely, sorts first: folders (_inbox/, _outbox/, _contacts/, _config/, _private/, _products/, _infrastructure/, _analytics/) and structure-bearing files that recur in every folder of a kind (_tasks.yaml, _insights.yaml, _meta.yaml, _manifest.md, _ops.yaml, _INDEX-*). Dot = read rarely, on demand, or never. Archive is ALWAYS .archive, never _archive. A dated post never takes underscore — it takes YYMMDD-."
      test: "is this surface read in everyday work? yes -> underscore, no -> dot"
      not_a_prefix_criterion: "WHO WRITES the surface is a separate property, declared per path, and never a reason for a prefix. _insights.yaml settles this: it is machine-written by /insights yet carries an underscore, because several skills READ it automatically. Generated does not imply dot."

    - id: "prefix_known_exception"
      level: standard
      rule: ".knowledge/ is READ frequently — INDEX.md is the documented first stop for any knowledge question — so by the rule above it would take an underscore. It keeps the dot for compatibility: the name is established in CR-027, INDEX.md, vault CLAUDE.md and every [[wiki]] link, and renaming costs more than the consistency gains. Declared here as a KNOWN EXCEPTION rather than hidden behind a rule it breaks. Do not cite .knowledge/ as precedent for dot-prefixing a new read surface. SECOND DECLARED EXCEPTION: .handoff/_archive keeps its underscore against the archive-is-always-.archive rule, because .handoff/ carries a TOTAL BLOCK (CR-033) — the surface is not touched by any skill, including to rename it. Exception by necessity, not by preference."

    - id: "dot_surface_levels"
      level: invariant
      rule: "Dot surfaces are of two kinds and skills must treat the second as a typed category, not a list of names. DORMANT (.archive/, .notes/, .ephemeral/): present, rarely read, safe to read on demand. BLOCKED — read access itself is constrained: .transcripts/ = read-block, never read back unattended and never quoted into summaries or insights; .handoff/ = total block, untouched by ops/insights/analytics/sweep/lint/normalize, never indexed, read only when named (CR-033). A new blocked surface must inherit the behaviour without patching each skill. NOTE: .knowledge/wiki/ is NOT blocked — it is read freely and often. Its constraint is WRITE-side (generated, hand-editing forbidden, owned by /insights synthesize, CR-027), which is a different axis; see prefix_known_exception."

    - id: "generated_view_isolation"
      level: standard
      rule: "A generated READ view that lives among its own source material must be isolated STRUCTURALLY, not by a skip flag. Put it in a hidden subfolder (<folder>/.status/current.md) rather than beside the sources as <folder>/_status.md. Reason: CR-033 found four skills reaching .handoff/ files despite an explicit skip-list, because they globbed on the YYMMDD- filename prefix rather than consulting the list. A per-folder markdown file among meeting documents is easier to hit by accident than one in a dot-folder. The dot here does not mean rarely read — the user opens it deliberately; it means unreachable by scanners, which is the .knowledge/wiki/ pattern applied at folder scope."

    - id: "system_file_language"
      level: standard
      rule: "System and structure files carry ENGLISH names regardless of the language of their content: _config/priority.md, _config/naming-prefix.md, _inbox/_frame.md, .status/current.md. Content stays in the vault's working language. Applies going FORWARD — the derived registers with Swedish names (_INDEX-agare.md, _INDEX-koppling.md, _INDEX-maskiner.md, _INDEX-objektmodell.md, _INDEX-verksamheter.md) are read by scripts and renaming them costs more than the consistency gains; the generated wiki articles under .knowledge/wiki/ likewise keep the language of the corpus they summarise."

    - id: "identifier_language"
      level: standard
      rule: "Identifiers are ENGLISH; the words a person reads may be in any language, and are data rather than literals in code. This covers schema field names, enum values, status keys, config keys, dictionary keys and variable names — everything a second tool must agree with in order to interoperate. Display text (a manifest's Status wording, an external board's column name, a generated view's headings) stays in the vault's working language and lives in a settings or vocabulary file, so changing it is a settings change rather than a code change. Where an identifier and its label were historically the same string, the LABEL keeps the existing spelling: renaming a key costs nothing, while renaming a label changes what an external system or a person sees. A reader meeting a value it does not recognise should tolerate it rather than silently treat it as the default — see task_statuses, where recognising only the canonical set made finished tasks count as outstanding. THIS DECLARATION FOLLOWS ITS OWN RULE: where a field is named here, it is named by its identifier, not by the label a vault happens to write it under. Five entries described a manifest's fields as Status/Kanal/Kontakt until 2026-09-21, which reads as Swedish identifiers in a public contract and invites a tool to hardcode the label."

    - id: "filename_role_keyword"
      level: standard
      rule: "A filename is YYMMDD-<role>-<description>.md (CR-089). The ROLE keyword is an identifier — scripts and skills select files by it — so it is ENGLISH and comes from `terms:` (`file:`). The description stays in the working language and keeps å/ä/ö (CR-021). FORWARD ONLY: existing files are never renamed; every reader also accepts the term's `legacy_file:` keywords, and a check flags only files dated on or after the release. A series' declared note_suffix / agenda_suffix always wins over the default keyword, because a series that changed shape mid-history reads as a broken carry-forward chain."

    - id: "one_term_per_concept"
      level: standard
      rule: "Every concept has one term, declared once in `terms:` (CR-089). Skill names are nouns (the place or object owned) unless declared `kind: command_name`; subcommands are verbs, or `<object> <verb>`; a verb means the same thing in every skill; the loop's step ids ARE the command verbs; anything outside the loop is named for what it repairs or explains. A localized word not declared in a term's language column is drift. `avoid:` phrases are checked by scripts/check-terms.py."

    - id: "write_ownership"
      level: standard
      rule: "Independent of the prefix, every surface declares who may write it. HUMAN: _inbox/_capture.md, _inbox/_frame.md, _meta.yaml, .handoff/ (once, then frozen). GENERATED — hand-editing forbidden: .knowledge/wiki/ (/insights synthesize, CR-027), _INDEX-maskiner.md and _INDEX-koppling.md (scan.py), the personal working-document view (CR-035). MIXED: _tasks.yaml, _insights.yaml. A generated surface that is edited by hand loses its next regeneration silently — which is why the property is declared rather than inferred from the prefix."

    - id: "audit_lifecycle"
      level: standard
      rule: "An audit or review document lives in _inbox/ only WHILE IN USE. Once its decisions are made and executed it moves to _inbox/.archive/. An audit left in place after execution becomes a competing source of truth against the working document (observed 260907). _inbox/ normally holds at most three CONTENT files: the working document, one active audit, one active review. Declared system files do not count against the ceiling (_capture.md, _frame.md, _inbox.yaml, _tasks.yaml) — they are infrastructure of the surface, not material passing through it. More than three content files means something has taken up residence, which CR-025 forbids in principle but does not measure."

    - id: "stale_vs_junk"
      level: standard
      rule: "Stale is not junk. A document that WAS current and is now outdated is archived to .archive/ (never deleted). Material with no vault destination goes to .ephemeral/ and may die (swept after 14 days, CR-024). Conflating the two loses history or retains rubbish."

    - id: "audio_transcript_pairing"
      level: invariant
      rule: "Audio in _inbox/.audio/<basename>.m4a and the matching transcript at _inbox/<basename>.md are paired by basename. Tools that rename one must rename the other. Detailed in CR-012."

# --- Visualisation app features ---
# --- Outbound dispatch (CR-047) ---
# How staged material actually leaves the vault. The skills author it; separate
# tools deliver it. Declared here so a reader knows these tools exist and what
# they are permitted to touch.
outbound_dispatch:
  contract: "_outbox/<item>/_manifest.md — see vault_conventions for the path declaration"

  tools:
    - name: "the dashboard"
      kind: "external app, outside this repo"
      role: "Reads the vault and serves it: tasks, insights, activity — and the outbox, where staged material is previewed and dispatched through a channel"
      reads: ["_outbox/", "the vault generally"]
      writes: ["_outbox/<item>/_manifest.md — the status, status-note, channel and contact fields only"]
      never: "Authors a manifest, decides what a status means, or archives. Archiving is /outbox's: eight steps across several files with judgement calls. The status-note is an exception that proves the rule — a dispatcher may record WHAT IT DID first-hand (channel, time, which recipient, a message id) because that is observation, not judgement; it may not write what that outcome MEANS for the item"
      note: "Dispatch began as a separate tool and was merged in 2026-09-21. Two surfaces for one workflow was the wrong shape once the dashboard could write at all. It binds to localhost, because it can now send as the user"

    - name: "chat-archive/send CLI"
      kind: "external library + CLI, outside this repo"
      role: "Messaging-platform client: delegated auth, chat messages, Markdown to the platform's markup"
      reads: ["chats the signed-in user belongs to"]
      writes: ["<venture>/.teamschats/ — the archive", "<venture>/.teamschats/_fetch.json — the fetch record (CR-088)", "chat messages"]
      never: "Knows nothing about vaults or manifests. The dashboard imports it as the messaging channel; it is a dependency of vault-aware code, not an instance of it"

  channels:
    - name: "teams"
      via: "the chat CLI, delegated as the signed-in user"
      scopes: "delegated chat read/send plus own-profile; no application-only access"
      status: "in use"
    - name: "email"
      via: "the local mail client, composing a draft — never sending. Where the client cannot be driven (a background supervisor), writes a .eml the user opens"
      scopes: []
      status: "in use; a draft always requires a human to press send"

  known_gaps:
    - id: "archive-of-unsent-items"
      what: "/outbox close requires a sent status, so an item decided against — marked as superseded, replaced or withdrawn — can never be archived and stays in _outbox indefinitely"
      seen: "a steady residue of stop-marked items that nothing files"
      proposal: "Treat a stop-marked manifest as archivable when its outcome section states why. That section already exists (written `## Utfall` in a Swedish vault), and 'not sent, because X' is an outcome"
      owner: "/outbox skill — the dispatcher must not invent a status the skill does not recognise"

# --- Components and how they connect (CR-050) ---
#
# vault_conventions declares how each part touches FILES. This declares how the
# parts touch EACH OTHER: what imports what, what calls out to a third-party
# service, and which direction each dependency runs.
#
# Written after three writers/readers rows went stale within hours of being
# true, and after a question that had no single answer: "where is the full
# picture documented?" It was spread across five places, none of them machine
# readable.
#
# Kinds are ROLES, not product names. This file is public and describes a
# framework, so a component is "a dashboard", not an instance. An installation
# maps its own tools onto these roles; the private map of which repo plays
# which role belongs beside that installation, not here.
# CR-078: `documentation_owner` says WHERE a fact about this component is written.
#   this_repo - the behaviour lives here, so the doc does too
#   external  - another repo's commit would change it; this contract links, never explains
#   none      - OS/terminal basics: link outward, own nothing
# The test for anything new: if this behaviour changed tomorrow, which repo's commit
# would change it? That repo documents it. A user's experience being continuous does
# not make the ownership continuous - a page may READ as one journey while each
# section is owned where its behaviour lives.

components:
  - id: "skills"
    kind: "instruction sets loaded into a session"
    documentation_owner: this_repo   # CR-078: The skills ARE this repo; behaviour and doc change in the same commit
    role: "The framework itself. Read and write vault files; hold what each file MEANS"
    reads: ["the vault, per vault_conventions"]
    writes: ["the vault, per vault_conventions"]
    depends_on: []
    note: "A skill cannot start a session — it is loaded INTO one. Anything that must start something is a tool, not a skill"

  - id: "dashboard"
    kind: "local web application"
    documentation_owner: external   # CR-078: Its own repo owns how it is run; this contract owns only which vault files it may read
    role: "Reads the vault and serves it: tasks, insights, activity, and the outbox where staged material is dispatched"
    reads: ["the vault broadly"]
    writes:
      - "_inbox/_tasks.yaml — appends a captured task, marks one finished"
      - "_inbox/_inbox.yaml — capture items"
      - "_outbox/<item>/_manifest.md — the status, status-note, channel and contact fields only"
      - "<folder>/_summary.yaml — its own derived cache"
      - "<folder>/_ops.yaml — one external_systems.chats entry, on explicit confirmation (CR-064)"
    depends_on: ["messaging client (as a library, for the chat channel)"]
    binds: "localhost only — it can send as the user"
    note: "Not read-only, and has not been since it gained the outbox. What it may write is deliberately narrower than what it may read"

  - id: "messaging client"
    kind: "library plus CLI"
    documentation_owner: external   # CR-078: Provider-specific: auth and platform vocabulary change in its repo
    role: "Talks to a chat platform: delegated auth, read and send messages, Markdown to the platform's markup"
    reads: ["chats the signed-in user belongs to"]
    writes: ["<venture>/.teamschats/ — the archive", "<venture>/.teamschats/_fetch.json — the fetch record (CR-088)", "chat messages"]
    depends_on: ["an auth library", "an HTTP library"]
    note: "Knows nothing about vaults or manifests. A dependency of vault-aware code, not an instance of it — which is why it is its own component rather than part of the dashboard"

  - id: "task pipeline"
    kind: "local scripts, run on demand"
    documentation_owner: external   # CR-078: Local scripts with their own README; the contract owns the file shapes, not the invocation
    role: "Keeps an external task service in step with the vault's task ledger"
    reads: ["_inbox/_tasks.yaml", "_inbox/_capture.md", "_inbox/_frame.md"]
    writes: ["_inbox/_tasks.yaml", "the generated triage view", "the external service"]
    depends_on: ["an external task service (one script only)"]
    note: "The vault is the source of truth; the external service is a mirror. Only one of its scripts reaches the service at all — the rest never leave the vault"

  - id: "capture app"
    kind: "companion application"
    documentation_owner: external   # CR-078: Recording, speaker assignment and reprocessing are the product's behaviour, not the vault's
    role: "Drops captured material into the vault from outside a session"
    reads: []
    writes: ["_inbox/", "_inbox/.audio/"]
    depends_on: []

  - id: "repo metadata archiver"
    kind: "local CLI, run on demand or on a schedule"
    documentation_owner: external   # CR-078: Its own CLI and credentials; the contract owns the archive layout
    role: "Archives a declared repository's metadata - issues, releases, commit subjects - into the vault, so a meeting can ask what changed since it last met"
    reads: ["external_systems.repos in a folder's config", "a hosting platform's API, through its own CLI"]
    writes: ["<venture>/.githubmeta/ — the archive", "<venture>/.githubmeta/_fetch.json — the fetch record (CR-088)"]
    depends_on: ["the hosting platform's CLI, already authenticated"]
    note: "Metadata only, never the code: a vault holds the record of work, not the work. Carries no credential of its own - a second auth path for one account is a second thing to rotate"

  - id: "jira metadata archiver"
    kind: "local CLI, run on demand or on a schedule"
    documentation_owner: external   # CR-078: Same as its siblings: shape declared here, tool documents itself
    role: "Archives a declared issue board's metadata - issues with their status and assignee, released versions - into the vault, so a meeting can ask where work stands without opening the tracker"
    reads: ["external_systems.jira in a folder's config", "the issue tracker's REST API"]
    writes: ["<venture>/.jirameta/ — the archive", "<venture>/.jirameta/_fetch.json — the fetch record (CR-088)"]
    depends_on: ["an API token held outside the vault"]
    note: "Metadata only - an issue's description and comments are the conversation itself and stay in the tracker. Read-only by construction: every call is a GET, so the archive can never become a participant in the work it records. UNLIKE its GitHub sibling it holds a credential, because the tracker has no already-authenticated CLI to borrow - the one place the pattern is less clean (CR-074). A fetch that hits its cap declares itself partial rather than recording a truncated board as a complete one"

  - id: "inventory scanner"
    kind: "local script, run on demand"
    documentation_owner: external   # CR-078: A local script; the contract owns the vault files it produces
    role: "Sweeps the machines a vault describes and regenerates the index files that say what runs where"
    reads: ["its own machine list — the source of truth for which machines exist"]
    writes: ["_INDEX-*.md — the generated machine and mapping registers"]
    depends_on: []
    note: "The one component that bridges the two maps: its INPUT is infrastructure and its OUTPUT is a vault file. Generated — hand-editing a register loses it on the next sweep"

  - id: "landing page"
    kind: "public website"
    documentation_owner: this_repo   # CR-078: Renders orientation and working_loop from this contract; what it SAYS about the framework is declared here
    role: "Explains the framework and how to install it"
    reads: ["this file, fetched from the public repo"]
    writes: []
    depends_on: ["this contract"]
    note: "A CONSUMER of the contract, never a source of it. The dependency runs contract -> site; inverting it would make the framework depend on a website"

# How to read the graph above:
#   - `depends_on` is a build/runtime dependency: A cannot work without B.
#   - Two components that only share a vault file are NOT dependent. They are
#     coupled through the file, and vault_conventions is where that is declared.
#     This is the point of the split: a file is a contract between components,
#     so they need not know about each other.
#   - A cycle in depends_on is a defect. The landing page depending on the
#     contract while the contract knows nothing of the landing page is correct.

# --- The working loop (CR-062) ---
#
# components: says what the parts ARE. This says what a person DOES, in order,
# and which part serves each step. Declared rather than drawn twice: the README
# and the landing page both render a diagram of this loop, and a hand-written
# copy in each is two things to keep true - which is exactly how the README's
# "what's new" list ended up seventeen releases stale.
#
# Steps are ordered. `manual: true` marks a step a person performs, and those
# are not unbuilt features: each is a place where generating the obvious answer
# would be confidently wrong in a way the reader could not check.
# ORIENTATION (CR-077) — what a person needs to understand BEFORE the loop makes sense.
# Written because two onboardings produced the same questions, and none of them were
# about the loop: they were about the substrate. The guide taught the sequence; the
# failures were all about the room. A person cannot run the loop before they can read
# the room.
#
# RENDERED, NEVER RESTATED. Same rule as working_loop below: README, landing page,
# `/ops help` and any dispatching surface render these entries in their own idiom. A
# renderer that paraphrases is a copy, and a copy is a second thing to keep true.
#
# Each entry carries the QUESTION AS ASKED, not a topic heading — the wording is the
# evidence, and a person recognises their own question faster than a category.
# `sources` names the declarations the answer derives from, so an answer that drifts
# from the contract can be caught.
orientation:
  - id: where_to_start
    question: "Where do I start a session, and why does it matter?"
    answer: >-
      Start inside the vault folder, not your home directory. A session started above the
      vault searches everything beside it too, and answers then mix material from places
      that have nothing to do with each other. The vault root is the folder holding _inbox/
      and _outbox/.
    sources: [vault_conventions.conventions.vault_relative]

  - id: inbox_outbox
    question: "What are inbox and outbox?"
    answer: >-
      _inbox/ is where unprocessed input lands and waits to be classified — a door, not a
      home, so it normally holds very few files. _outbox/ is where outgoing material is
      staged before it is sent, and it keeps the record of what was sent when. One of each,
      both at the vault root; per-folder copies are not part of the contract.
    sources: [vault_conventions.vault_root, vault_conventions.conventions.single_inbox_outbox]

  - id: dot_vs_underscore
    question: "Why do some folders start with a dot and others with an underscore?"
    answer: >-
      The prefix answers one question: is this read in everyday work? Underscore means yes
      and sorts it to the top. Dot means rarely, on demand, or never. Who WRITES a file is
      a separate thing and never a reason for a prefix — _insights.yaml is machine-written
      and still carries an underscore, because skills read it automatically.
    sources: [vault_conventions.conventions.prefix_conventions]

  - id: sealed_surfaces
    question: "What is .transcripts/, and how do I get the raw text when I need it?"
    answer: >-
      Raw transcripts are kept there as the audit trail behind a summary. The summary is
      what the vault treats as true; the raw material is not read back and quoted into new
      documents, because a summary that keeps being re-derived stops being a decision.
      Ask for it explicitly when you need it — it is sealed, not hidden.
    sources: [vault_conventions.vault_root]

  - id: context_window
    question: "New window or resume — when do I want which?"
    answer: >-
      Resuming restores exactly where you left off, including everything already read in —
      but it knows nothing about files changed since. Start a new window when the subject
      changes, or when files have moved underneath you, and read in only what that work
      needs. Two windows can run against the same files without knowing about each other.
      Nothing is implicit: what is in the window is what was read into it.
    sources: []

  - id: pasted_material
    question: "How do I paste something in safely?"
    answer: >-
      Say what it is and where it came from on the line above, then put the material itself
      in a fenced block. Fenced, it is read as data. Unfenced, a sentence inside it that
      reads like an instruction can be followed as one — which is a property of the pasted
      text, not of your intent.
    sources: []

  - id: structure_grows
    question: "Does the structure have to be right from the start?"
    answer: >-
      No, and trying to make it right first is the most common way to stall. Put the
      material in; the structure is proposed from what is actually there and changes as
      more arrives. A folder tree invented before the content exists describes work nobody
      has done yet.
    sources: [vault_conventions.conventions.placement_classes]

  - id: correcting_data
    question: "Something is wrong in a file — do I edit it?"
    answer: >-
      Say what is wrong and let the skill correct it. The files are readable on purpose and
      you may open any of them, but a correction made by hand is invisible to everything
      that maintains the file, and the next run can write over it. Stating the correction
      keeps one writer per file.
    sources: [vault_conventions.per_folder]

working_loop:
  - id: "orient"
    phase: "when picking it up"
    label: "where it left off"
    command: "/ops orient <folder>"
    does: "Reads one folder's current state before any work resumes: loop position and whether the next agenda exists, whether the carry-forward chain is intact, what is carrying and how much of it is unowned, how stale the archives are, what is staged and unsent, and when the record last moved. Read-only - it writes nothing, fetches nothing and caches nothing, because an orientation file that persists can itself go stale and then lie"
    consumes: ["the summary", "_outbox/<item>/_manifest.md", "<venture>/.teamschats/", "<venture>/.githubmeta/"]
    produces: ["a reading of the current state"]

  - id: "declare"
    phase: "once, at set-up"
    label: "the folder's config"
    command: "edit <project>/.claude/ops-config.yaml, or the folder's _ops.yaml"
    does: "Declares which chat and repositories the work concerns, which post-meeting artifacts the series wants, and where its task ledger lives"
    produces: ["the config"]

  - id: "fetch"
    phase: "before the session"
    label: "the fetchers"
    external: true
    does: "Fetch the chat and repository archives. External CLIs, run on demand or on a schedule - never by a skill"
    consumes: ["the config"]
    produces: ["<venture>/.teamschats/", "<venture>/.githubmeta/"]

  - id: "prepare"
    phase: "before the session"
    label: "the agenda"
    command: "/ops prepare (runs build_agenda.py where the loop is wired); /preparation without a config"
    does: "Writes the agenda: what did not land last time, with its session count and age, then what the archives hold that the room has not heard"
    consumes: ["<venture>/.teamschats/", "<venture>/.githubmeta/", "the summary's carry-forward section"]
    produces: ["the agenda"]

  - id: "facilitate"
    phase: "before the session"
    label: "the facilitator sheet"
    does: "Turning a fact into the right question"
    consumes: ["the agenda"]
    manual: true
    why_manual: "The agenda carries facts; which question to ask is judgement, not generation"

  - id: "meet"
    phase: "the session"
    label: "the meeting"
    external: true
    does: "Recorded, so everything asynchronous is invisible to it by construction - which is what the archives exist to answer. The transcript ARRIVES BY SEVERAL ROUTES - a recorder into a knowledge base read over MCP, a file dropped in, or text pasted straight into the session. The loop does not care which; it cares that the source is NAMED in the note, because two recordings of one meeting is the normal case and a note that cannot say which one it came from cannot be corrected against it"
    produces: ["a transcript"]

  - id: "process"
    phase: "after, the same day"
    label: "one pass over the transcript"
    command: "/ops process <transcript> (the default); /transcript without a config"
    does: "The summary, the changelog line, the ledger and insights, the raw source archived to .transcripts/ (CR-085), and whatever the folder declared"
    consumes: ["a transcript", "the config"]
    # CR-085: the raw archive is written unasked and read back only on explicit
    # request. A summary without its source has no arbiter, and the absence
    # cannot announce itself — the summary looks complete either way.
    produces: ["the summary", "the ledger and insights", ".transcripts/<stem>-raw.md", "a staged recap"]

  - id: "carry"
    phase: "after, the same day"
    label: "the summary's carry-forward"
    command: "written into the summary by /ops process; verified by /ops check <folder>"
    does: "What did not land becomes the top of the next agenda. This is where the loop closes"
    consumes: ["the summary"]
    produces: ["the summary's carry-forward section"]

  - id: "recap"
    phase: "after, the same day"
    label: "the recap"
    does: "Offered rather than written: assembled from the narrowest of three inputs it would be confidently incomplete, and invisibly so to a reader with no transcript to check it against"
    consumes: ["the summary"]
    manual: true
    why_manual: "Whether a session warrants a recap is a judgement about the audience, not about the material"

  - id: "send"
    phase: "after, the same day"
    label: "staging and sending"
    command: "/outbox list, then /outbox close <folder> once resolved"
    does: "Staged as a folder with a manifest; a dispatching surface delivers it and records what it did"
    consumes: ["a staged recap"]
    produces: ["_outbox/<item>/_manifest.md"]

  - id: "deliver"
    phase: "after, the same day"
    label: "the dispatching surface"
    external: true
    does: "A dashboard reads _outbox/, previews the staged item and delivers it over the channel its manifest declares - a chat workspace through the messaging client, or an email draft a person presses send on. It writes back status, status-note, channel and contact ONLY; it never authors a manifest, decides what a status means, or archives"
    consumes: ["_outbox/<item>/_manifest.md"]
    produces: ["the message, delivered"]

  - id: "record"
    phase: "after, the same day"
    label: "marking it sent"
    does: "The manifest's status is the only record that something actually went out"
    consumes: ["the message, delivered"]
    manual: true
    why_manual: "That click is where the posted message gets read as it actually landed"

  - id: "compound"
    phase: "weekly"
    label: "the knowledge loop"
    command: "/insights compile, then /insights synthesize"
    does: "Confirmed hypotheses become standing rules; the corpus renders to a wiki"
    consumes: ["the ledger and insights"]

  - id: "check"
    phase: "weekly"
    label: "the shape checks"
    command: "/ops check <folder>, then /ops check"
    does: "On a folder it finds a broken carry-forward chain and template forks; on the vault it finds closure debt. Both catch the failures that announce nothing"
    consumes: ["the summary", "the ledger and insights"]

visualisation_features:
  - id: dashboard
    label: Dashboard
  - id: inbox
    label: Inbox
  - id: tasks
    label: Task Board
  - id: projects
    label: Projects
  - id: documents
    label: Documents
  - id: insights
    label: Insights
  - id: analytics
    label: Analytics
  - id: mcp
    label: MCP Server
