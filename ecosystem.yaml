# ecosystem.yaml — Shared contract for core-skills ecosystem
# Single source of truth for type enums, skill metadata, schema versions,
# and vault file conventions.
# Marvin (formerly core-skills-visualisation) and the landing page reference
# this file. Future tools (Trillian, external skills, third-party clients)
# should also use it as the authoritative contract.
# No PII. Public-safe.

# CORRECTION 2026-09-12 (CR-044): this field read `2` until today. Versions 3-6
# below were each documented by their CR but the value was never changed —
# `git log -S` finds one commit touching it, the one that created this file.
# Nothing reads the field back, so nothing caught it. Corrected to 7 in one step;
# no client was ever served 3, 4, 5 or 6.
#
# contract_version 31 (CR-088, 2026-09-25, v1.78.0): each archive root carries a _fetch.json —
#   <venture>/.teamschats/, .githubmeta/ and .jirameta/ each gain one record of the last
#   fetch: when it was attempted, when it last succeeded, and the result (ok, partial,
#   auth_required, error, timeout; an unknown value reads as error). A snapshot older
#   than the note could not say whether nothing happened, the fetch never ran, or it
#   failed on an expired login — and once fetching is scheduled the last is the usual
#   case. Written by the fetcher, so a run started by hand records itself too. The one
#   file in those dot-folders any tool may read: timestamps and a status, nothing from
#   the source. Nothing here schedules or fetches; the offline guarantee holds.
#
# contract_version 30 (CR-087, 2026-09-24, v1.77.0): external_systems.transcripts —
#   the store a session's recording lands in, with `match` deciding which recordings
#   belong to the series and an optional `archive` a script may read. A session that
#   was recorded and never written up is invisible to every other signal: notes,
#   agendas, archives and the outbox all read as healthy, and the next agenda then
#   skips the session silently. Nothing here fetches; the offline guarantee holds.
#
# contract_version 29 (CR-084 + CR-086, 2026-09-24, v1.76.0): two additions to the
#   ops-config schema. CR-084: people[].track — the axis the round runs along, read
#   from the previous note first and this default second; `areas` is never read as a
#   track, which is how that column came to hold the wrong thing. CR-086: registry: —
#   where a new project must appear, declared at both the vault and organisation
#   layers and merged by the config chain, with propose as the default for a
#   hand-written register because such a register carries judgement a skill cannot know.
#
# contract_version 28 (CR-085, 2026-09-24, v1.75.0): the after-meeting step produces a
#   raw source archive. /ops never archived its source although it is documented as a
#   superset of /transcript, which has done so since Step 2.5 — the contract lived in one
#   skill instead of the shared base, so there was no single definition to inherit. Moved
#   to ops-base: one definition, two callers. Raw frontmatter gains summaries: and
#   disposition: for one input feeding several folders.
#
# contract_version 27 (CR-078, 2026-09-24, v1.74.0): documentation_owner on each
#   component. The routing question — where does this fact get written — had no
#   declared answer, so it was answered by whatever was convenient and the same fact
#   ended up in two places that drifted. The test: if this behaviour changed tomorrow,
#   which repo's commit would change it? That repo documents it.
#
# contract_version 26 (CR-077, 2026-09-24, v1.73.0): orientation — what a person needs
#   to understand BEFORE the loop makes sense. Two onboardings produced the same eight
#   questions and none were about the loop; the guide taught the sequence while every
#   failure was about the substrate. Declared once, rendered by README, landing page and
#   `/ops help`, never restated — the working_loop rule, for the same reason.
#
# contract_version 19 (CR-064, 2026-09-21, v1.63.0): a dispatching surface may
#   add ONE external_systems.chats entry to a folder's ops config, on explicit
#   confirmation. The file stays hand-written in every other respect; this is
#   the one fact a dispatcher knows first-hand and a person cannot easily get
#   right — two of the live vault's chats share a name exactly, so a pick from
#   a listing of seventy is a coin flip nothing records.
#
# contract_version 18 (CR-062, 2026-09-21, v1.59.0): working_loop — the steps a person
#   takes, in order, with the three manual ones marked and each saying WHY. The
#   README and the landing page both render this loop; a hand-written copy in
#   each is two things to keep true, which is how the README's release list went
#   seventeen versions stale without anyone noticing.
#
# contract_version 17 (CR-055, 2026-09-21): <venture>/.githubmeta/ declared, and a
#   repo metadata archiver component. The sibling of .teamschats/: same layout, same
#   dot-folder reasoning, one difference - a day's file is a snapshot rather than
#   a merge, because issue state is a reading taken at a moment. Makes CR-054's
#   repos: block readable by something other than a dashboard.
#
# contract_version 16 (CR-054, 2026-09-21): external_systems in the ops config —
#   a folder declares which chats its work is posted to and which repositories it
#   concerns. Written because the destination of a staged recap was nowhere
#   declared: it was chosen from a live list of seventy chats by recognising the
#   name. A declaration, never a credential; hand-written, so a tool may read it
#   but never append what it happened to use.
#
# contract_version 25 (CR-074, 2026-09-22): <venture>/.jirameta/ declared, and
#   external_systems gains a `jira:` key beside `chats:` and `repos:`. The vault
#   archived what was SAID and what SHIPPED; what was TRACKED was missing, and it
#   is the half that says what is planned rather than what already happened.
#   Same layout as .githubmeta/ so a reader that walks one walks all three.
#   Metadata only -- an issue's description and comments are the conversation
#   itself and stay in the tracker. Additive: a folder declaring no board is
#   unaffected, and clients on 24 ignore the path.
#
# contract_version 24 (CR-072, 2026-09-22): a folder may declare itself a
#   RECURRING SERIES with a top-level `series:` block (`name`, `cadence`) in its
#   ops config. Written because `/ops projects` — whose whole job is to say what
#   is wired — scans only the project trees, so a fully wired weekly living in a
#   meetings tree was invisible to it. The declaration also licenses resolving
#   `carry_forward` UP the config chain for that folder: a series inherits its
#   loop from an ancestor config, and reading only its own file reports a running
#   loop as no loop. DECLARED, NEVER INFERRED — every folder carrying an org
#   config would otherwise read as a series, including the org root. The chain
#   walk is deliberately NOT extended to project folders: an org-level
#   carry_forward names one series in its `note_suffix`, so sibling projects
#   inheriting it would be reported as having loops that do not exist, and
#   over-reporting a loop is worse than under-reporting one — the promised
#   agenda is never generated and nobody finds out until an item has fallen
#   through. Additive: clients on 23 ignore the block.
#
# contract_version 23 (CR-070, 2026-09-22): `classification` gains a third value,
#   management-only — NAMED RECIPIENTS rather than a group. The first two values
#   scale a group; the third leaves group distribution. CR-066 settled the enum by
#   surveying 20 live manifests, which establishes what the values are CALLED but
#   not how many there are: a survey finds only what someone already wrote. The
#   21st manifest, staged hours later, was a confirmation recap to one named person
#   carrying judgements about third parties — team-only would have recorded the
#   wrong KIND of audience, and the author wrote an undeclared value instead,
#   following a standard that already defined three levels. A schema that cannot
#   express what its source document mandates relocates drift rather than
#   preventing it. PERMISSIVENESS ORDER IS NOW EXPLICIT (team-wide-safe >
#   team-only > management-only) because warn-on-widening needs it and a
#   dispatcher inferring an order is a dispatcher deciding policy (CR-047).
#   Additive: clients on 22 see an unrecognised value and tolerate it (CR-049).
#
# contract_version 22 (CR-069, 2026-09-22): a STATUS/RESULTS REPORT standard is
#   declared in ops-base, beside the TWO-TIER meeting-summary format. Additive —
#   it introduces a new report kind (measurement-driven: data source + period),
#   changes no existing format or section order. A producing skill references the
#   standard and supplies its own metrics, reconciliation identities, freshness
#   thresholds and cadences; the standard supplies the six required elements
#   (scorecard-first trend, partial-period guard, reconciliation invariants,
#   honest provenance + blind spots, a warn-not-fail freshness gate, owner-ranked
#   actions). Business-agnostic; not a `/ops` format (that processes meetings).
#
# contract_version 21 (CR-068, 2026-09-22): `<venture>/.chats/` is renamed to
#   `<venture>/.teamschats/`. A BREAKING rename, not an addition: a client on 20
#   reading the old path finds nothing. "chats" had become ambiguous once Claude
#   Code transcripts were also called chats, and the folder holds one provider's
#   messages only; the name now says which. It aligns with `.githubmeta/`, its
#   sibling since CR-055, where the source is likewise in the name. NOTE the one
#   thing that does NOT change: `external_systems.chats` stays `chats` - that is a
#   config KEY naming a class of system, not a path, and a venture may declare
#   chats from a provider that is not Teams. Historic entries below and in the
#   CHANGELOG keep the old path: they record what was true when written.
#
# contract_version 20 (CR-066, 2026-09-22): the manifest declares `classification` —
#   who may receive the item, distinct from `channel`/`contact` which say where it
#   is going. Already in use by 20 live manifests before being declared, the same
#   way status-note was: practice ran ahead of the schema. Two values,
#   team-wide-safe (the default when absent) and team-only; a third, `internal`,
#   had appeared as an undeclared synonym and was normalised away — the drift a
#   field with no declared options produces. AUTHORED BY THE SKILL, READ-ONLY to a
#   dispatcher, which is what lets it inform a send without the dispatcher deciding
#   policy. A dispatching surface WARNS when a send would widen the audience beyond
#   the declared value and requires confirmation; it does not refuse. Additive:
#   clients on 19 ignore it.
#
# contract_version 15 (CR-053, 2026-09-21): the manifest's fields are named by
#   IDENTIFIER here, not by the Swedish label a vault writes them under - five
#   entries said "Status, Kanal, Kontakt", which reads as Swedish identifiers in
#   a public contract and invites a tool to hardcode the label. Also declares the
#   status-note field: it was in use by 104 live manifests while appearing in no
#   schema, and a dispatcher may write it because recording what it did is
#   observation, not judgement.
#
# contract_version 14 (CR-052, 2026-09-21): inventory scanner component and the
#   generated _INDEX-*.md registers it writes. Found by asking which parts of the
#   graph were content rather than architecture: the scanner had been left out
#   although it writes vault files, and check-components.py had let its write pass
#   because the entry was phrased as prose rather than a path. Both fixed.
#
# contract_version 13 (CR-051, 2026-09-21): _infrastructure/ and _architecture/
#   declared. The first was named in prefix_conventions since CR-034 but never
#   declared as a path; the second is its counterpart for the software system —
#   the same question one layer up. Both SINGLETON: each describes the whole,
#   so a folder-scoped copy would describe nothing.
#
# contract_version 12 (CR-050, 2026-09-21): components block — declares how the
#   parts touch EACH OTHER, where vault_conventions declares how they touch files.
#   Written because "where is the full picture documented" had no single answer:
#   it was spread across five places, none machine readable. Writing it found two
#   vault files nothing had declared. scripts/check-components.py keeps the two
#   blocks honest; it runs from the alignment check.
#
# contract_version 11 (CR-049, 2026-09-21): identifier_language rule — identifiers
#   are English, the words a person reads are data. Written after a dispatcher was
#   found hardcoding the vault's Swedish status words and a sync tool using Swedish
#   display strings as dictionary keys in 38 places.
#
# contract_version 10 (CR-048, 2026-09-21): task_statuses enum — declares which
#   statuses a task may carry. schemas.tasks named a version but never the legal
#   values, and three dialects grew in the gap; a reader that knew only the
#   canonical set counted finished tasks as outstanding. Split active/finished,
#   since that is the question every consumer actually asks.
#
# contract_version 33 (CR-092, 2026-09-26): NOT additive. `rule` belongs to the insight
#   lifecycle (CR-089), so the contract's own uses are renamed: the block key
#   vault_conventions.rules -> vault_conventions.conventions, and the middle level
#   `rule` -> `standard` (invariant > standard > guideline). Readers accept the old
#   key and value for one release; ids and meanings are unchanged.
# contract_version 32 (CR-089, 2026-09-26): one term per concept. NOT additive:
#   `terms:` declares every concept once (English identifier, localized attribute,
#   loop verb, filename keyword, legacy filename keywords, phrases to avoid);
#   working_loop steps `archive` -> `fetch` and `agenda` -> `prepare`, every step's
#   command names a command; subcommands renamed to the loop verbs with the old
#   names declared as `aliases` for one release; daily-dashboard retired and md2pdf
#   moved out of the suite (registry 12 -> 10 invocable); registry in loop order;
#   `filename_role_keyword` rule. Clients on 31 see two fewer skills and two
#   renamed step ids; nothing in a vault is renamed.
# contract_version 9 (CR-047, 2026-09-21): outbound_dispatch block — declares the
#   tools that deliver staged material, the channels they use, and what each
#   may write. Also declares <venture>/.teamschats/
#   and brings the _outbox/ declaration up to date with the manifest contract.
#   Additive: clients on 8 ignore it.
# contract_version 8 (CR-046, 2026-09-20): `metric` added to insight_types.content --
#   a measurement where the number IS the insight, with optional value/unit/baseline/
#   period/trend fields. Excluded from CR-013 promotion: a repeated measurement is a
#   time series, not a rule.
# contract_version 7 (CR-040, 2026-09-12): a PER_FOLDER file's presence may be
#   CONDITIONAL — a folder declaring an external system of record legitimately has
#   no _tasks.yaml. Parsers must not read that absence as missing data.
# contract_version 6 (CR-038, 2026-09-08): generated-view isolation + system-file language.
# contract_version 5 (CR-037, 2026-09-07): rule hierarchy + conflict resolution.
# contract_version 4 (CR-036, 2026-09-07): placement classes + singleton test.
# contract_version 3 (CR-034/CR-035, 2026-09-07): prefix_conventions replaced
#   yaml_naming; added dot_surface_levels, audit_lifecycle, stale_vs_junk; declared
#   _inbox/_tasks.yaml as source of truth with the working doc as a generated view.
# contract_version 2 (CR-010, 2026-04-29): added vault_conventions block.
#
# Bumps are additive — clients on contract_version 1 ignore the new block;
# clients on version 2 or later get the structured vault-file declarations.
contract_version: 33
core_skills_version: "1.81.0"

# --- Schema versions ---
# insights schema 2 (CR-013): adds optional `confidence` (hypothesis|rule),
# `confirmation_count`, `confirmations[]`, and `contradicted_by[]` fields per
# entry. Bump is additive — v1 readers ignore unknown fields.
schemas:
  ops_config: "1.4"
  contact_meta: "1.1"
  tasks: 2
  insights: 2

# --- Task status enum ---
# Declared here because it was not, and three other dialects grew in its
# absence: `open`/`done`, `todo`/`waiting`, and one-off words like
# `superseded`. A tool reading only the canonical set counted finished tasks
# as outstanding. The schema in the tasks skill has always said this; saying
# it here too is what makes it checkable.
task_statuses:
  active:
    - pending
    - in_progress
    - blocked
  finished:
    - completed
    - cancelled
  note: "A reader should tolerate an unknown status rather than treat it as active; a writer should emit only these."

# --- Insight type enums ---
insight_types:
  content:
    - decision
    - preference
    - learning
    - opportunity
    - pattern
    - quote
    - metric
  evolution:
    - edge_case
    - correction
    - skill_pattern

# --- Contact classification (CR-009) ---
contact_classification:
  levels:
    - family
    - personal
    - professional
    - confidential
  default: professional
  private_mapping:
    family: true
    personal: true
    professional: false
    confidential: false
  folder_pattern_defaults:
    family:
      - "_contacts/a1-*"
      - "_contacts/a2*"
    personal:
      - "_private/**"

# --- Skills registry ---
skills:
  # Declared in LOOP ORDER (CR-089): the landing page renders this order, so this is
  # the one place it is set. Subcommands are the loop's verbs. CR-089's one-release
  # aliases were removed in 1.81.0.
  user_invocable:
    - name: inbox
      description: "Universal entry point for unstructured content — classifies and routes. Maintains the triage working surface (CR-022)."
      badge: Capture
      subcommands: [status, route, triage, help]
    - name: preparation
      description: "The config-free form of /ops prepare: an agenda for a meeting with a contact, with a walk-in card on top."
      badge: Context
      subcommands: [help]
    - name: transcript
      description: "The config-free form of /ops process: a summary from a transcript of a call, meeting or voice recording."
      badge: Lightweight
      subcommands: [help]
    - name: ops
      description: "The config layer over prepare and process, plus orient, check and project set-up — config-driven for any organization."
      badge: Primary
      subcommands: [process, prepare, orient, check, status, project list, project new, normalize, help]
    - name: outbox
      description: "Lifecycle management for `_outbox/` items — list pending, close resolved ones into their contact or project folder."
      badge: Utility
      subcommands: [list, status, close, close --all-sent, help]
    - name: tasks
      description: "Personal task tracker with cross-project correlation."
      badge: Tracking
      subcommands: [list, add, done, import, weekly, archive, help]
    - name: handoff
      description: "Frozen, self-contained context documents in `.handoff/` — bounded subjects a different work session can pick up cold. Human-actioned only; no skill reads them."
      badge: Utility
      subcommands: [list, read, help]
    - name: insights
      description: "Knowledge extraction manager and skill evolution engine."
      badge: Knowledge
      subcommands: [reprocess, scan-claude-md, compile, migrate, synthesize, propose, status, help]
    - name: analytics
      description: "Vault-level content analytics — trends, skill adoption, contact engagement, backlog."
      badge: Knowledge
      subcommands: [overview, skills, contacts, pipeline, backlog, help]
    - name: update-skills
      description: "Skill repo management — fetch, pull, symlink, health audit."
      badge: Utility
      subcommands: [update, check, status, install, help]
  non_invocable:
    - name: ops-base
      description: "Shared operational framework (meeting formats, task management, workflows)."
    - name: ops-config
      description: "Configuration system — schema definition and base defaults."

# --- Terms (CR-089) ---
# One entry per concept. `en` is the identifier and is always English; `sv` (and any
# other language column) is the only permitted localized form of it. `verb` is the loop
# step that produces the thing. `file` is the filename role keyword for new files;
# `legacy_file` lists older keywords every reader still accepts (forward only: nothing is
# renamed). `avoid` holds phrases scripts/check-terms.py rejects in skill prose - kept to
# phrases that can be replaced mechanically; a word with a legitimate second meaning is
# explained in `note` instead of being banned.
terms:
  # places
  - {id: vault, en: vault, sv: valv}
  - {id: venture, en: venture, sv: verksamhet, note: "a top-level business folder; the config key `organization` keeps its name"}
  - {id: project, en: project, sv: projekt, note: "a folder whose config runs the loop"}
  - {id: contact, en: contact, sv: kontakt, note: "a folder under _contacts/, with no config"}
  - {id: config, en: config, sv: konfiguration, note: "the resolved chain: project, _ops.yaml, _config/base.yaml, defaults", avoid: ["org config", "org configs", "ops config", "ops configs"]}
  # meetings
  - {id: meeting, en: meeting, sv: möte, note: "one occurrence: a meeting, a call or a recording"}
  - {id: series, en: series, sv: serie}
  - {id: session, en: session, sv: session, note: "a Claude Code session; in older text also a meeting of a series"}
  - {id: transcript, en: transcript, sv: transkript, note: "the input; the raw copy lives in .transcripts/", avoid: ["raw transcript"]}
  - {id: summary, en: summary, sv: sammanfattning, verb: process, file: summary, legacy_file: [samtal, sammanfattning, möte], note: "the config keys note_suffix keep their name", avoid: ["the note", "the notes"]}
  - {id: agenda, en: agenda, sv: agenda, verb: prepare, file: agenda, legacy_file: [förberedelse, preparation]}
  - {id: facilitator-sheet, en: facilitator sheet, sv: facilitatorsblad, verb: facilitate, file: facilitator, avoid: ["facilitator notes", "facilitator file", "facilitator files"]}
  - {id: carry-forward, en: carry-forward, sv: överföring, verb: carry, avoid: ["carried items", "carry-over"]}
  - {id: recap, en: recap, sv: recap, verb: recap, file: recap}
  - {id: priorities, en: priorities, sv: prioriteringar, file: priorities}
  # work and knowledge
  - {id: task, en: task, sv: uppgift, note: "the action-table column (Action / Åtgärd) is a template-contract heading (CR-018) and keeps its label"}
  - {id: ledger, en: ledger, sv: uppgiftsregister, note: "where tasks live; matches workflows.task_ledger"}
  - {id: index, en: index, sv: index, note: "the generated _INDEX-* files; a project REGISTRY (CR-086) is a different, hand-written thing"}
  - {id: insight, en: insight, sv: insikt}
  - {id: rule, en: rule, sv: regel, note: "an insight confirmed often enough to be loaded as a standing instruction (CR-013)"}
  - {id: convention, en: convention, sv: konvention, note: "the contract's rules for the vault (vault_conventions.conventions, CR-092)"}
  - {id: standard, en: standard, sv: standard, note: "a convention's middle level: holds generally, exceptions named (CR-037, CR-092)"}
  - {id: wiki, en: wiki, sv: wiki, verb: compound, avoid: ["knowledge base"]}
  - {id: handoff, en: handoff, sv: överlämning, file: handoff}
  # movement and retirement
  - {id: fetch, en: fetch, sv: hämta, verb: fetch, note: "an external system into a local archive; component ids keep 'archiver'"}
  - {id: archive, en: archive, sv: arkiv, note: "the fetched local copy only"}
  - {id: snapshot, en: snapshot, sv: ögonblicksbild, note: "a dated file inside an archive"}
  - {id: retire, en: retire, sv: pensionera, note: "to .archive/ or a tombstone; the folder keeps its name"}
  - {id: close, en: close, sv: stänga, note: "a resolved outbox item, filed with its recipient"}
  # command names kept as names
  - {id: ops, en: ops, kind: command_name, note: "the config layer; the suite's major part"}
  - {id: preparation, en: preparation, kind: command_name, note: "the config-free form of /ops prepare"}

# --- Output artifacts ---
# (Legacy flat list kept for back-compat with contract_version 1 clients.
#  Newer clients should consume vault_conventions below for full semantics —
#  writers, readers, schemas, lifecycle.)
output_artifacts:
  per_folder:
    - "_insights.yaml"
    - "_tasks.yaml"
    - "CHANGELOG.md"
  vault_root:
    - "_analytics/"
    - "_inbox/"
    - "_outbox/"
    - "_tasks.yaml"
    - "_tasks-history.md"

# --- Vault file conventions (CR-010) ---
# Authoritative declaration of every file the suite produces or consumes
# in a user's vault. Includes path pattern, purpose, schema link (when one
# exists), writers, readers, and lifecycle. Tools like Marvin, Trillian,
# Deep Thought adapters, and future skills should read this as the contract.
vault_conventions:

  # Files and folders that live at the vault root.
  vault_root:
    - path: "_inbox/"
      purpose: "Capture: unprocessed input awaiting classification"
      schema: "docs/schemas/inbox.md"
      writers: ["/inbox", "trillian", "deep-thought", "marvin"]
      readers: ["/inbox", "trillian", "marvin"]
      lifecycle: "append; items move to .archive/ after processing"

    - path: "CONTEXT.md"
      purpose: "Hand-written orientation at vault root: the frame the rest of the vault is read against — what is active, what is paused, which decisions are open, what governs the calendar. INDEX.md answers WHERE things live; CONTEXT.md answers WHAT APPLIES. Singleton (CR-036): there is one context, not one per folder"
      schema: null
      writers: ["user (manual)"]
      readers: ["user", "any session needing orientation"]
      lifecycle: "updated when something material changes — frame shift, new operative commitment, resolved blocker, closed track — never on a schedule"

    - path: "<folder>/.status/current.md"
      purpose: "Generated situational view for one contact or org person: meeting cadence over months, insight counts by type with the most recent named, open items, and the last movement from CHANGELOG. Answers 'where does this relationship stand' without reading a year of files. Lives in a HIDDEN subfolder so scanning skills cannot reach it — structural isolation rather than a skip flag, because CR-033 showed skip-lists are missed when skills glob on the YYMMDD- prefix"
      schema: null
      writers: ["render_status.py (generated)"]
      readers: ["user (read)"]
      lifecycle: "regenerated per folder after each new conversation; hand edits are lost"

    - path: "_inbox/_tasks.yaml"
      purpose: "Personal working tasks — SOURCE OF TRUTH (CR-035, supersedes CR-022 in part). Standard v2 task schema plus triage_id (preserves the {id} token used by external sync). task: states what is to be done and nothing else; history, references and reasoning go in notes:"
      schema: "tasks v2"
      writers: ["user (manual)", "import from _inbox/_capture.md", "a dashboard may append a captured task and mark one finished — those two fields only"]
      readers: ["/ops", "marvin", "external sync (todoist-task-pipeline)"]
      lifecycle: "append; status pending -> completed (see task_statuses); completed items archived to .archive/"

    - path: "_inbox/_inbox.yaml"
      purpose: "The inbox register: one entry per captured item, with its classification, routing and status. The markdown files in _inbox/ are the material; this is the index over them"
      schema: "inbox v2 — see docs/schemas/inbox.md"
      writers: ["/inbox", "a dashboard (capture and classification)"]
      readers: ["/inbox", "/analytics", "a dashboard"]
      lifecycle: "append on capture; status pending -> processed; processed entries archived with their files"

    - path: "_inbox/_capture.md"
      purpose: "Free-form write path for tasks (CR-035). One line each; import moves them into _tasks.yaml and empties this file. Syntax: @tag or [Tag] -> context, !P0..!P3 -> priority, clock+YYMMDD -> due"
